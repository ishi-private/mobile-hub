<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アニメ視聴ランチャー</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: #0f0f13; color: #e2e2e2; min-height: 100vh; }
  .page-nav a { color: #556; text-decoration: none; }
  .page-nav a:hover { color: #999; }
  .page-nav .sep { color: #2a2a35; }
  .page-nav .current { color: #bbb; font-weight: 600; }
  .main { padding: 0 16px 40px; }
  .controls { max-width: var(--page-max-width); margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  #search-wrap { flex: 1; position: relative; }
  #search { width: 100%; padding: 10px 16px 10px 38px; font-size: 0.95rem;
             background: #1c1c24; border: 1px solid #333; border-radius: 8px;
             color: #e2e2e2; outline: none; }
  #search:focus { border-color: #555; }
  #search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
                  color: #555; font-size: 0.9rem; pointer-events: none; }
  .view-toggle { display: flex; flex-shrink: 0; }
  .vbtn { padding: 9px 14px; font-size: 0.78rem; font-weight: 600; border: 1px solid #333;
           background: #1c1c24; color: #555; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .vbtn:first-child { border-radius: 6px 0 0 6px; }
  .vbtn:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .vbtn.active { background: #2a2a35; color: #ccc; border-color: #444; }
  #btn-shuffle { padding: 9px 14px; font-size: 0.78rem; font-weight: 600; border: 1px solid #333;
                  border-radius: 6px; background: #1c1c24; color: #888; cursor: pointer;
                  transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
  #btn-shuffle:hover { background: #2a2a35; color: #ccc; border-color: #444; }
  #count { text-align: center; font-size: 0.78rem; color: #444; margin-bottom: 14px; }

  /* ── テキストビュー（サイトドメイン別 表形式） ── */
  #list { max-width: var(--page-max-width); margin: 0 auto; }
  .anime-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
  .anime-table thead th { text-align: left; padding: 4px 12px; font-size: 0.7rem;
                            color: #667; font-weight: 600; }
  .anime-table thead th.domain-th { text-align: center; }
  .anime-table tbody tr.anime-row td { background: #1c1c24; border-top: 1px solid #2a2a35;
                                         border-bottom: 1px solid #2a2a35; padding: 9px 12px; }
  .anime-table tbody tr.anime-row td:first-child { border-left: 1px solid #2a2a35; border-radius: 8px 0 0 8px; }
  .anime-table tbody tr.anime-row td:last-child { border-right: 1px solid #2a2a35; border-radius: 0 8px 8px 0; }
  .anime-table tbody tr.anime-row:hover td { border-color: #444; }
  .title-cell { min-width: 0; }
  .anime-table tbody tr.anime-row td.title-cell.has-state {
    border-left: 3px solid var(--row-state-color, transparent); }
  .title-cell-inner { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .title-cell .title-text { min-width: 0; flex: 1; }
  .title-cell .primary { color: #e2e2e2; font-size: 0.93rem; line-height: 1.3; }
  /* ── ★お気に入り/永久保存版・📌今期見たい登録・❤おすすめ 共通ボタン ──
     いずれも枠付きの丸チップにして、ポスター画像の上に重ねても位置・タップ範囲が分かるようにする。
     📌はfavorites.html（今期見たい）内の「今すぐ見たい」ピンとは別物（このページ専用のピンで、
     これがONの作品だけがfavorites.html（今期見たい）に表示される）。 */
  .ls-chip { flex-shrink: 0; width: 24px; height: 24px; border: 1px solid #333; border-radius: 50%;
              background: rgba(10,10,14,0.55); cursor: pointer; padding: 0;
              display: flex; align-items: center; justify-content: center;
              font-size: 1rem; line-height: 1; color: #555; transition: transform 0.1s, border-color 0.15s; }
  .ls-chip:hover { transform: scale(1.15); border-color: #666; }
  .ls-star.active { border-color: currentColor; }
  .ls-pin.active { color: #fff; border-color: #fff; }
  .ls-heart.active { color: #e0447c; border-color: #e0447c; }
  .domain-cell { text-align: center; white-space: nowrap; width: 1%; }
  .site-btn { padding: 5px 11px; border: none; border-radius: 5px;
               font-size: 0.76rem; font-weight: 600; cursor: pointer;
               color: #fff; text-decoration: none; white-space: nowrap;
               transition: opacity 0.15s; display: inline-block; }
  .site-btn:hover { opacity: 0.82; }
  .site-btn.pending { background: #444 !important; opacity: 0.55;
                       border: 1px solid #666; cursor: help; }
  .site-btn.pending:hover { opacity: 0.75; }
  .site-btn.dash { background: #2a2a35 !important; color: #556; opacity: 0.5;
                    border: 1px solid #333; font-weight: 400; cursor: pointer; }
  .site-btn.dash:hover { opacity: 0.75; }
  .site-btn.empty { background: #444 !important; opacity: 0.5;
                     border: 1px solid #555; cursor: pointer; }
  .site-btn.empty:hover { opacity: 0.75; }
  .no-sites { font-size: 0.73rem; color: #333; font-style: italic; }

  /* ── 画像ビュー ── */
  #list.img { display: flex; flex-direction: column; gap: 12px; }
  .flat-grid { display: grid;
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px; }
  .img-card { background: #1c1c24; border: 1px solid #2a2a35; border-radius: 8px;
               overflow: hidden; transition: border-color 0.15s; }
  .img-card:hover { border-color: #555; }
  .img-card.src-mal   { border-color: #4a9eff; }
  .img-card.src-mal:hover { border-color: #77bbff; }
  .img-card.has-state { box-shadow: 0 0 0 2px var(--row-state-color); }
  .img-card .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover;
                       display: block; background: #1a1a22; }
  .img-card .no-poster { width: 100%; aspect-ratio: 2/3; display: flex;
                           align-items: center; justify-content: center;
                           background: #1a1a22; color: #333; font-size: 2rem; }
  .img-card .ititle { padding: 6px 7px 4px; font-size: 0.7rem; color: #ccc;
                       line-height: 1.35; overflow: hidden;
                       display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .img-card .ictrl { padding: 5px 7px 0; display: flex; align-items: center; gap: 3px; }
  .img-card .ibtns { padding: 4px 7px 8px; display: flex; gap: 3px; flex-wrap: wrap; }
  .img-btn { padding: 3px 7px; border: none; border-radius: 4px; font-size: 0.62rem;
              font-weight: 700; color: #fff; text-decoration: none; cursor: pointer;
              display: inline-block; white-space: nowrap; }
  .img-btn.pending { background: #444 !important; opacity: 0.6; border: 1px solid #666; cursor: help; }
  .img-btn.empty { background: #444 !important; opacity: 0.5; border: 1px solid #555; }

  /* ── ポスタービュー（画像=直接リンク、サイト色ボーダー） ── */
  #list.poster { display: flex; flex-direction: column; gap: 12px; }
  .poster-flat-grid { display: grid;
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px; }
  .poster-card { position: relative; display: block; background: #1c1c24; border: 2px solid #333;
                  border-radius: 8px; overflow: hidden; text-decoration: none;
                  transition: transform 0.15s, border-color 0.15s; cursor: pointer; }
  .poster-card:hover { transform: translateY(-2px); }
  .poster-card.no-link { cursor: default; border-color: #2a2a35; opacity: 0.6; }
  .poster-card.has-state { box-shadow: 0 0 0 2px var(--row-state-color); }
  .poster-card .poster { width: 100%; aspect-ratio: 1/1; object-fit: cover;
                       object-position: top; display: block; background: #1a1a22; }
  .poster-card .no-poster { width: 100%; aspect-ratio: 1/1; display: flex;
                           align-items: center; justify-content: center;
                           background: #1a1a22; color: #333; font-size: 2rem; }
  .poster-card .ptitle { padding: 6px 7px 7px; font-size: 0.7rem; color: #ccc;
                       line-height: 1.35; overflow: hidden;
                       display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  /* ── 登録操作（ポスター画像に重ねる丸チップボタン）。★・📌は左上、❤おすすめは右上 ── */
  .poster-ctrl { position: absolute; top: 5px; left: 5px; right: 5px; z-index: 2;
                  display: flex; align-items: center; justify-content: space-between; }
  .poster-ctrl-left { display: flex; align-items: center; gap: 4px; }
  .poster-ctrl .ls-chip { width: 22px; height: 22px; font-size: 0.85rem; }

  /* ── サイト凡例 ── */
  #site-legend { max-width: var(--page-max-width); margin: 0 auto 12px; display: flex;
                     align-items: center; gap: 12px; flex-wrap: wrap; font-size: 0.7rem; color: #777; }
  #site-legend .legend-item { display: flex; align-items: center; gap: 5px; }
  #site-legend .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* ── 上部フィルタ（★・❤・♡） ── */
  #interest-legend { max-width: var(--page-max-width); margin: 0 auto 12px; display: flex;
                       align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.72rem; color: #777; }
  .legend-filter-btn { display: flex; align-items: center; gap: 5px; padding: 4px 12px;
                         border: 1px solid transparent; border-radius: 14px; background: none;
                         cursor: pointer; font-size: 0.72rem; color: #888; transition: all 0.15s; }
  .legend-filter-btn:hover { background: #1c1c24; }
  .legend-filter-btn .ico { font-size: 0.95rem; }
  .legend-filter-btn.active { background: #1c1c24; color: #ddd; font-weight: 600; }

  /* ── 右クリックのコンテキストメニュー（★/📌/❤をクリックと同じ操作で切替） ── */
  .ctx-menu { position: fixed; z-index: 1000; background: #1c1c24; border: 1px solid #3a3a4a;
               border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden;
               min-width: 200px; display: none; }
  .ctx-menu-item { display: flex; align-items: center; gap: 9px; padding: 10px 14px;
                     font-size: 0.8rem; color: #ccc; cursor: pointer; white-space: nowrap; }
  .ctx-menu-item:hover { background: #262632; }
  .ctx-menu-item .ico { font-size: 1rem; width: 18px; text-align: center; flex-shrink: 0; }

  /* ── 分類セクション区切り（劇場版・webアニメ） ── */
  .tier-divider { max-width: var(--page-max-width); margin: 22px auto 14px;
                    display: flex; align-items: center; gap: 12px; }
  .tier-divider-line { flex: 1; height: 1px; background: #2a2a35; }
  .tier-divider-label { font-size: 0.78rem; color: #778; font-weight: 600; white-space: nowrap; }
  .tier-divider-row td { padding: 20px 12px 6px; border: none; background: transparent; }
  .tier-divider-row .tier-divider { margin: 0; max-width: none; }
</style>
</head>
<body>
<div class="site-header-sticky">
  <nav id="site-nav" class="page-nav"></nav>
  <script src="../shared/nav.js?v=20260924"></script>
  <script src="../anime-db/data/anime_guide_data.js"></script>
  <script src="../anime-db/data/anime_guide_sites.js"></script>
  <script src="../shared/favorites-data.js"></script>
  <script src="../shared/favorites.js?v=20260923"></script>
  <div class="controls">
    <div id="search-wrap">
      <span id="search-icon">🔍</span>
      <input id="search" type="text" placeholder="アニメを検索..." autofocus>
    </div>
    <div class="view-toggle">
      <button class="vbtn" id="btn-text" onclick="setView('text')">☰ テキスト</button>
      <button class="vbtn" id="btn-image" onclick="setView('image')">▦ 画像</button>
      <button class="vbtn active" id="btn-poster" onclick="setView('poster')">🖼 ポスター</button>
    </div>
    <button id="btn-shuffle" onclick="reshufflePoster()">🔀 ランダム</button>
  </div>
  <div id="interest-legend"></div>
  <div id="site-legend"></div>
</div>
<div class="main">
<div id="count"></div>
<div id="list"></div>
</div>
<script>
// ── データ: ANIME_GUIDE_DATA（全カタログ）+ ANIME_GUIDE_SITES（サイトリンク）を統合 ──
// 2026-09-24: 興味あり専用の別データ（旧GROUPS、確認済みリンクがある181作品のみ）を廃止し、
// favorites.html/anime-guide.htmlと同じ ANIME_GUIDE_DATA を使うよう統合した
// （作品ごとの2重管理を解消。リンクが無い作品も含め全カタログを表示し、★/📌/❤の登録枠を用意する）。
if (typeof ANIME_GUIDE_DATA === 'undefined') {
  document.getElementById('list').textContent = 'anime_guide_data.js が見つかりません。';
  throw new Error('no data');
}

const _SITE_PRIORITY = ['AnimeHeaven', 'GogoAnime', 'AnimeGG'];
function pickBestSite(sites) {
  const byLabel = {};
  (sites || []).forEach(function (s) { byLabel[s.label] = s; });
  for (let i = 0; i < _SITE_PRIORITY.length; i++) {
    const s = byLabel[_SITE_PRIORITY[i]];
    if (s && s.confirmed && s.url) return { url: s.url, label: s.label, color: s.color || '#555' };
  }
  for (let j = 0; j < _SITE_PRIORITY.length; j++) {
    const s2 = byLabel[_SITE_PRIORITY[j]];
    if (s2 && s2.url) return { url: s2.url, label: s2.label, color: s2.color || '#555' };
  }
  return null;
}

const ANIME = (ANIME_GUIDE_DATA.anime || []).map(function (a) {
  const sites = (window.ANIME_GUIDE_SITES || {})[String(a.id)] || [];
  return {
    anime_db_id: a.id,
    title: a.title,
    title_ja: a.title,
    sites: sites,
    mal_image_url: a.thumbnail,
    short_title: a.title,
    best_site: pickBestSite(sites),
  };
});
const ANIME_BY_ID = {};
ANIME.forEach(function (a) { ANIME_BY_ID[String(a.anime_db_id)] = a; });

// ── ★お気に入り/永久保存版（サブ分類）・📌今期見たいページへの登録ゲート・❤おすすめ ──
// favorites.html（今期見たい）と同じ shared/favorites.js の AnimeFavorites（localStorageベース）を
// そのまま使う。ID空間（anime_db_id）が共通のため、favorites.htmlで登録済みの状態はここにも
// 自動で反映される。📌を付けた作品だけが favorites.html（今期見たい）に表示される
// （このページ専用のピンで、favorites.html内の「今すぐ見たい」ピンとは別物）。
// ★・❤おすすめはfavorites.html内でも共通。
// 3つとも★/📌/❤すべてのビュー（テキスト・画像・ポスター）でクリック操作でき、右クリックの
// コンテキストメニューからも同じ操作ができる（どちらの操作方法でも登録/解除できる）。

function makeStarBtn(id, onUpdate) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'ls-chip ls-star';
  function render() {
    const state = AnimeFavorites.get(id);
    btn.textContent = AnimeFavorites.STATE_STAR[state];
    btn.classList.toggle('active', state > 0);
    btn.style.color = state > 0 ? AnimeFavorites.STATE_COLOR[state] : '';
    btn.title = AnimeFavorites.STATE_LABEL[state] + '（クリックで切替）';
  }
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    AnimeFavorites.cycle(id);
    render();
    if (onUpdate) onUpdate();
  });
  render();
  return btn;
}

// 絵文字📌はfill色を持つため CSS の color で active/非active を出し分けできない。
// favorites.html と同じ fill="currentColor" のSVGピンアイコンを使う。
const PIN_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">' +
  '<path d="M16,9V4h1V2H7v2h1v5c0,1.66-1.34,3-3,3v2h5.97v7l1,1l1-1v-7H19v-2C17.34,12,16,10.66,16,9z"/></svg>';

function makePinBtn(id, onUpdate) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'ls-chip ls-pin';
  btn.innerHTML = PIN_SVG;
  function render() {
    const pinned = AnimeFavorites.isInterestPinned(id);
    btn.classList.toggle('active', pinned);
    btn.title = pinned ? '今期見たいに登録済み（クリックで解除すると今期見たいページから消えます）' : '今期見たいに登録（クリックでON、今期見たいページに表示されます）';
  }
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    AnimeFavorites.toggleInterestPinned(id);
    render();
    if (onUpdate) onUpdate();
  });
  render();
  return btn;
}

function makeHeartBtn(id, onUpdate) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'ls-chip ls-heart';
  btn.textContent = '❤';
  function render() {
    const rec = AnimeFavorites.isRecommendedFlag(id);
    btn.classList.toggle('active', rec);
    btn.title = rec ? 'おすすめ登録済み（クリックで解除）' : 'おすすめに登録（クリックでON）';
  }
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    AnimeFavorites.toggleRecommendedFlag(id);
    render();
    if (onUpdate) onUpdate();
  });
  render();
  return btn;
}

// ── 分類分離: 劇場版・webアニメ は通常リストから外し、最下部に別セクションとして表示する ──
const WEB_ANIME_IDS = new Set([7022]); // 衛宮さんちの今日のごはん（webアニメで特殊なため分離）
function isMovieEntry(a) { return /劇場版|^映画/.test(a.title || ''); }
function isWebAnimeEntry(a) { return WEB_ANIME_IDS.has(a.anime_db_id); }

const TIERS = { normal: [], web: [], movie: [] };
ANIME.forEach(function (a) {
  if (isWebAnimeEntry(a)) TIERS.web.push(a);
  else if (isMovieEntry(a)) TIERS.movie.push(a);
  else TIERS.normal.push(a);
});

let VIEW = 'poster';

// ── 上部フィルタ（★永久保存版/お気に入り・📌お気に入り登録・❤おすすめ） ──
const STATE_FILTER = new Set();  // 1=お気に入り, 2=永久保存版。空=フィルターなし
let PIN_FILTER = false;
let RECOMMEND_FILTER = false;
function anyStateFilterActive() {
  return STATE_FILTER.size > 0 || PIN_FILTER || RECOMMEND_FILTER;
}
function matchesStateFilters(a) {
  const id = a.anime_db_id;
  if (STATE_FILTER.size > 0 && !STATE_FILTER.has(AnimeFavorites.get(id))) return false;
  if (PIN_FILTER && !AnimeFavorites.isInterestPinned(id)) return false;
  if (RECOMMEND_FILTER && !AnimeFavorites.isRecommendedFlag(id)) return false;
  return true;
}

// ポスタービュー専用の表示順（シャッフル）。デフォルトでシャッフル済みの状態で表示する。
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let POSTER_ORDER = {
  normal: shuffleArray(TIERS.normal),
  web: shuffleArray(TIERS.web),
  movie: shuffleArray(TIERS.movie),
};

function reshufflePoster() {
  POSTER_ORDER = {
    normal: shuffleArray(TIERS.normal),
    web: shuffleArray(TIERS.web),
    movie: shuffleArray(TIERS.movie),
  };
  renderList(document.getElementById('search').value);
}

function setView(v) {
  VIEW = v;
  document.getElementById('btn-text').classList.toggle('active', v === 'text');
  document.getElementById('btn-image').classList.toggle('active', v === 'image');
  document.getElementById('btn-poster').classList.toggle('active', v === 'poster');
  document.getElementById('btn-shuffle').style.display = v === 'poster' ? '' : 'none';
  renderList(document.getElementById('search').value);
}

function makeSiteBtns(sites, cls) {
  const frag = document.createDocumentFragment();
  const confirmed = (sites || []).filter(s => s.confirmed === true && !s.no_episodes);
  const empty     = (sites || []).filter(s => s.confirmed === true && s.no_episodes);
  const pending   = (sites || []).filter(s => s.confirmed === false && s.url);
  if (!confirmed.length && !empty.length && !pending.length) {
    if (cls !== 'img-btn') {
      const sp = document.createElement('span');
      sp.className = 'no-sites';
      sp.textContent = 'サイト未設定';
      frag.appendChild(sp);
    }
    return frag;
  }
  confirmed.forEach(s => {
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = cls;
    a.style.background = s.color || '#555';
    a.textContent = (cls === 'img-btn' ? '' : '▶ ') + s.label;
    frag.appendChild(a);
  });
  empty.forEach(s => {
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = cls + ' empty';
    a.title = '配信話数なし（ページはあるが空）';
    a.textContent = (cls === 'img-btn' ? '' : '▶ ') + s.label;
    frag.appendChild(a);
  });
  pending.forEach(s => {
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = cls + ' pending';
    a.title = '動画再生未確認 - クリックして確認';
    a.textContent = '？ ' + s.label;
    frag.appendChild(a);
  });
  return frag;
}

// テキストビューの列: サイトドメイン別（リンク未登録時はトップページへのグレーアウト「－」ボタン）
const DOMAINS = [
  { label: 'AnimeHeaven', color: '#e06c3c', top: 'https://animeheaven.me/' },
  { label: 'GogoAnime',   color: '#3c8be0', top: 'https://gogoanime.by/' },
  { label: 'AnimeGG',     color: '#c026d3', top: 'https://www.animegg.org/' },
];

function makeDomainCell(sites, domain) {
  const td = document.createElement('td');
  td.className = 'domain-cell';
  const found = (sites || []).find(s => s.label === domain.label);
  const a = document.createElement('a');
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  if (found && found.confirmed === true && found.no_episodes) {
    a.href = found.url;
    a.className = 'site-btn empty';
    a.textContent = '▶';
    a.title = domain.label + ': 配信話数なし（ページはあるが空）';
  } else if (found && found.confirmed === true) {
    a.href = found.url;
    a.className = 'site-btn';
    a.style.background = found.color || domain.color;
    a.textContent = '▶';
    a.title = domain.label;
  } else if (found && found.confirmed === false && found.url) {
    a.href = found.url;
    a.className = 'site-btn pending';
    a.textContent = '？';
    a.title = domain.label + ': 動画再生未確認 - クリックして確認';
  } else {
    a.href = domain.top;
    a.className = 'site-btn dash';
    a.textContent = '－';
    a.title = domain.label + ': リンク未登録（トップページを開く）';
  }
  td.appendChild(a);
  return td;
}

// ★の状態を枠線の色として要素に反映する（favorites.htmlのapplyBorderと同様の考え方）
function applyStateBorder(el, id) {
  const state = AnimeFavorites.get(id);
  el.classList.toggle('has-state', state > 0);
  el.style.setProperty('--row-state-color', AnimeFavorites.STATE_COLOR[state] || 'transparent');
}

function makeTextRow(anime) {
  const tr = document.createElement('tr');
  tr.className = 'anime-row';
  tr.dataset.id = anime.anime_db_id;
  const titleTd = document.createElement('td');
  titleTd.className = 'title-cell';
  applyStateBorder(titleTd, anime.anime_db_id);
  const inner = document.createElement('div');
  inner.className = 'title-cell-inner';
  inner.appendChild(makeStarBtn(anime.anime_db_id, function () { applyStateBorder(titleTd, anime.anime_db_id); }));
  inner.appendChild(makePinBtn(anime.anime_db_id));
  inner.appendChild(makeHeartBtn(anime.anime_db_id));
  const textWrap = document.createElement('div');
  textWrap.className = 'title-text';
  textWrap.innerHTML = `<div class="primary">${anime.title_ja || anime.title}</div>`;
  inner.appendChild(textWrap);
  titleTd.appendChild(inner);
  tr.appendChild(titleTd);
  DOMAINS.forEach(d => tr.appendChild(makeDomainCell(anime.sites, d)));
  return tr;
}

function makeImgCard(anime) {
  const card = document.createElement('div');
  card.dataset.id = anime.anime_db_id;
  const hasImg = !!anime.mal_image_url;
  card.className = 'img-card' + (hasImg ? ' src-mal' : '');
  applyStateBorder(card, anime.anime_db_id);
  if (hasImg) {
    const img = document.createElement('img');
    img.className = 'poster';
    img.src = anime.mal_image_url;
    img.alt = anime.title_ja || anime.title;
    img.loading = 'lazy';
    card.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'no-poster';
    ph.textContent = (anime.title_ja || anime.title || '?')[0];
    card.appendChild(ph);
  }
  const cDiv = document.createElement('div');
  cDiv.className = 'ictrl';
  cDiv.appendChild(makeStarBtn(anime.anime_db_id, function () { applyStateBorder(card, anime.anime_db_id); }));
  cDiv.appendChild(makePinBtn(anime.anime_db_id));
  cDiv.appendChild(makeHeartBtn(anime.anime_db_id));
  card.appendChild(cDiv);
  const tDiv = document.createElement('div');
  tDiv.className = 'ititle';
  tDiv.textContent = anime.title_ja || anime.title;
  card.appendChild(tDiv);
  const bDiv = document.createElement('div');
  bDiv.className = 'ibtns';
  bDiv.appendChild(makeSiteBtns(anime.sites, 'img-btn'));
  card.appendChild(bDiv);
  return card;
}

// サイト凡例（優先順位・色は _best_site() と同期させること）
const SITE_LEGEND = [
  { label: 'AnimeHeaven', color: '#e06c3c' },
  { label: 'GogoAnime',   color: '#3c8be0' },
  { label: 'AnimeGG',     color: '#c026d3' },
  { label: 'リンクなし',   color: '#333' },
];

function renderPosterLegend() {
  const el = document.getElementById('site-legend');
  el.innerHTML = '';
  SITE_LEGEND.forEach(s => {
    const item = document.createElement('span');
    item.className = 'legend-item';
    const dot = document.createElement('span');
    dot.className = 'legend-dot';
    dot.style.background = s.color;
    item.appendChild(dot);
    item.appendChild(document.createTextNode(s.label));
    el.appendChild(item);
  });
}

function makePosterImg(anime) {
  if (anime.mal_image_url) {
    const img = document.createElement('img');
    img.className = 'poster';
    img.src = anime.mal_image_url;
    img.alt = anime.short_title || anime.title_ja || anime.title;
    img.loading = 'lazy';
    return img;
  }
  const ph = document.createElement('div');
  ph.className = 'no-poster';
  ph.textContent = (anime.short_title || anime.title_ja || anime.title || '?')[0];
  return ph;
}

function makePosterCard(anime) {
  const best = anime.best_site;
  const card = document.createElement(best ? 'a' : 'div');
  card.dataset.id = anime.anime_db_id;
  card.className = 'poster-card' + (best ? '' : ' no-link');
  if (best) {
    card.href = best.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.style.borderColor = best.color || '#333';
  }
  applyStateBorder(card, anime.anime_db_id);
  card.appendChild(makePosterImg(anime));

  const ctrl = document.createElement('span');
  ctrl.className = 'poster-ctrl';
  const ctrlLeft = document.createElement('span');
  ctrlLeft.className = 'poster-ctrl-left';
  ctrlLeft.appendChild(makeStarBtn(anime.anime_db_id, function () { applyStateBorder(card, anime.anime_db_id); }));
  ctrlLeft.appendChild(makePinBtn(anime.anime_db_id));
  ctrl.appendChild(ctrlLeft);
  ctrl.appendChild(makeHeartBtn(anime.anime_db_id));
  card.appendChild(ctrl);

  const tDiv = document.createElement('div');
  tDiv.className = 'ptitle';
  tDiv.textContent = anime.short_title || anime.title_ja || anime.title;
  card.appendChild(tDiv);
  return card;
}

function makeTierDivider(label) {
  const div = document.createElement('div');
  div.className = 'tier-divider';
  div.innerHTML = `<span class="tier-divider-line"></span>` +
    `<span class="tier-divider-label">${label}</span>` +
    `<span class="tier-divider-line"></span>`;
  return div;
}

function makeTierDividerRow(label) {
  const tr = document.createElement('tr');
  tr.className = 'tier-divider-row';
  const td = document.createElement('td');
  td.colSpan = DOMAINS.length + 1;
  td.appendChild(makeTierDivider(label));
  tr.appendChild(td);
  return tr;
}

// ── 右クリックのコンテキストメニュー（★/📌/❤ をボタンクリックと同じ動作で操作できる） ──
function refreshItemInPlace(id) {
  const anime = ANIME_BY_ID[String(id)];
  if (!anime) return;
  const old = document.querySelector('[data-id="' + id + '"]');
  if (!old) return;
  const fresh = VIEW === 'text' ? makeTextRow(anime) : VIEW === 'image' ? makeImgCard(anime) : makePosterCard(anime);
  old.replaceWith(fresh);
}

const ctxMenu = document.createElement('div');
ctxMenu.className = 'ctx-menu';
document.body.appendChild(ctxMenu);

function hideCtxMenu() { ctxMenu.style.display = 'none'; }

function showCtxMenu(x, y, id) {
  ctxMenu.innerHTML = '';
  const state = AnimeFavorites.get(id);
  const items = [
    { ico: '★', label: AnimeFavorites.STATE_LABEL[state] + '（クリックで切替）', act: function () { AnimeFavorites.cycle(id); } },
    { ico: '📌', label: AnimeFavorites.isInterestPinned(id) ? '今期見たい登録を解除' : '今期見たいに登録', act: function () { AnimeFavorites.toggleInterestPinned(id); } },
    { ico: '❤', label: AnimeFavorites.isRecommendedFlag(id) ? 'おすすめを解除' : 'おすすめに登録', act: function () { AnimeFavorites.toggleRecommendedFlag(id); } },
  ];
  items.forEach(function (it) {
    const el = document.createElement('div');
    el.className = 'ctx-menu-item';
    el.innerHTML = '<span class="ico">' + it.ico + '</span><span>' + it.label + '</span>';
    el.addEventListener('click', function () {
      it.act();
      hideCtxMenu();
      refreshItemInPlace(id);
    });
    ctxMenu.appendChild(el);
  });
  const menuW = 220, menuH = 130;
  ctxMenu.style.left = Math.min(x, window.innerWidth - menuW) + 'px';
  ctxMenu.style.top = Math.min(y, window.innerHeight - menuH) + 'px';
  ctxMenu.style.display = 'block';
}

document.getElementById('list').addEventListener('contextmenu', function (e) {
  const target = e.target.closest('[data-id]');
  if (!target) return;
  e.preventDefault();
  showCtxMenu(e.clientX, e.clientY, target.dataset.id);
});
document.addEventListener('click', function (e) {
  if (!ctxMenu.contains(e.target)) hideCtxMenu();
});
document.getElementById('list').addEventListener('scroll', hideCtxMenu, true);
window.addEventListener('scroll', hideCtxMenu, true);

// ── フィルター（検索語 + 上部フィルタ） ──
// 2026-09-24: データセット統合（全カタログ表示）に伴い、検索していない通常のブラウズ時は
// ★登録済み（興味あり）の作品のみを表示するよう戻した（★の色がそのままボーダー表示の基準にもなる）。
// 検索語を入力した時だけ全カタログを対象にし、新規に★を付けて興味ありに追加できるようにする。
function filterItems(list, q) {
  return list.filter(function (a) {
    if (q) {
      if (!((a.title || '').toLowerCase().includes(q) || (a.title_ja || '').toLowerCase().includes(q))) return false;
    } else if (AnimeFavorites.get(a.anime_db_id) === 0) {
      return false;
    }
    if (!matchesStateFilters(a)) return false;
    return true;
  });
}

// ── 段階レンダリング（全カタログ5000件超を一度にDOM化すると重いため、通常タイルは
//    RENDER_BATCH件ずつ「さらに読み込む」で追加する。web/劇場版は件数が少ないため一括表示） ──
const RENDER_BATCH = 150;
let _pending = null; // { normal: [...残り], web: [...], movie: [...] }

function ensureTextTbody() {
  const container = document.getElementById('list');
  let table = container.querySelector('table.anime-table');
  if (table) return table.querySelector('tbody');
  table = document.createElement('table');
  table.className = 'anime-table';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const titleTh = document.createElement('th');
  titleTh.textContent = '作品';
  headRow.appendChild(titleTh);
  DOMAINS.forEach(function (d) {
    const th = document.createElement('th');
    th.className = 'domain-th';
    th.textContent = d.label;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  container.appendChild(table);
  return tbody;
}

function ensureGrid(gridClass) {
  const container = document.getElementById('list');
  const last = container.lastElementChild;
  if (last && last.classList && last.classList.contains(gridClass)) return last;
  const grid = document.createElement('div');
  grid.className = gridClass;
  container.appendChild(grid);
  return grid;
}

function appendSection(items, label) {
  if (!items || items.length === 0) return;
  const container = document.getElementById('list');
  if (VIEW === 'text') {
    const tbody = ensureTextTbody();
    tbody.appendChild(makeTierDividerRow(label));
    items.forEach(function (a) { tbody.appendChild(makeTextRow(a)); });
  } else {
    container.appendChild(makeTierDivider(label));
    const grid = document.createElement('div');
    grid.className = VIEW === 'poster' ? 'poster-flat-grid' : 'flat-grid';
    container.appendChild(grid);
    items.forEach(function (a) { grid.appendChild(VIEW === 'poster' ? makePosterCard(a) : makeImgCard(a)); });
  }
}

function appendBatch() {
  const oldWrap = document.getElementById('load-more-wrap');
  if (oldWrap) oldWrap.remove();

  const batch = _pending.normal.splice(0, RENDER_BATCH);
  if (VIEW === 'text') {
    const tbody = ensureTextTbody();
    batch.forEach(function (a) { tbody.appendChild(makeTextRow(a)); });
  } else {
    const grid = ensureGrid(VIEW === 'poster' ? 'poster-flat-grid' : 'flat-grid');
    batch.forEach(function (a) { grid.appendChild(VIEW === 'poster' ? makePosterCard(a) : makeImgCard(a)); });
  }

  if (_pending.normal.length > 0) {
    const wrap = document.createElement('div');
    wrap.id = 'load-more-wrap';
    wrap.style.cssText = 'text-align:center;margin:20px 0;';
    const btn = document.createElement('button');
    btn.className = 'vbtn';
    btn.style.cssText = 'display:inline-block;border-radius:6px;padding:9px 18px;';
    btn.textContent = 'さらに読み込む（残り ' + _pending.normal.length + ' 件）';
    btn.addEventListener('click', appendBatch);
    wrap.appendChild(btn);
    document.getElementById('list').appendChild(wrap);
    return;
  }

  appendSection(_pending.web, '📺 webアニメ');
  appendSection(_pending.movie, '🎬 劇場版');
  _pending.web = [];
  _pending.movie = [];
}

function renderList(query) {
  const q = query.trim().toLowerCase();
  const source = VIEW === 'poster' ? POSTER_ORDER : TIERS;
  const normal = filterItems(source.normal, q);
  const web    = filterItems(source.web, q);
  const movie  = filterItems(source.movie, q);
  const total = normal.length + web.length + movie.length;
  document.getElementById('count').textContent =
    total === ANIME.length ? `${ANIME.length} 作品` : `${total} / ${ANIME.length} 作品`;

  const container = document.getElementById('list');
  container.innerHTML = '';
  hideCtxMenu();

  if (total === 0) {
    container.className = '';
    container.innerHTML = '<div style="max-width:var(--page-max-width);margin:40px auto;text-align:center;color:#444;font-size:0.85rem;">' +
      (q ? '該当する作品が見つかりません。' : '★を付けた作品がまだありません。検索して作品を探し、★をクリックして興味ありに追加してください。') +
      '</div>';
    document.getElementById('site-legend').style.display = 'none';
    return;
  }

  if (VIEW === 'poster') {
    document.getElementById('site-legend').style.display = 'flex';
    renderPosterLegend();
    container.className = 'poster';
  } else if (VIEW === 'image') {
    document.getElementById('site-legend').style.display = 'none';
    container.className = 'img';
  } else {
    document.getElementById('site-legend').style.display = 'none';
    container.className = 'text';
  }

  _pending = { normal: normal, web: web, movie: movie };
  appendBatch();
}
function makeStateLegendBtn(state, label) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'legend-filter-btn';
  const color = AnimeFavorites.STATE_COLOR[state];
  btn.innerHTML = '<span class="ico" style="color:' + color + '">★</span><span>' + label + '</span>';
  function render() {
    const active = STATE_FILTER.has(state);
    btn.classList.toggle('active', active);
    btn.style.borderColor = active ? color : 'transparent';
  }
  btn.addEventListener('click', function () {
    if (STATE_FILTER.has(state)) STATE_FILTER.delete(state);
    else STATE_FILTER.add(state);
    render();
    renderList(document.getElementById('search').value);
  });
  render();
  return btn;
}

function makePinLegendBtn() {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'legend-filter-btn';
  btn.innerHTML = '<span class="ico">📌</span><span>今期見たい登録</span>';
  function render() {
    btn.classList.toggle('active', PIN_FILTER);
    btn.style.borderColor = PIN_FILTER ? '#fff' : 'transparent';
  }
  btn.addEventListener('click', function () {
    PIN_FILTER = !PIN_FILTER;
    render();
    renderList(document.getElementById('search').value);
  });
  render();
  return btn;
}

function makeRecommendLegendBtn() {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'legend-filter-btn';
  btn.innerHTML = '<span class="ico" style="color:#e0447c">❤</span><span>おすすめ</span>';
  function render() {
    btn.classList.toggle('active', RECOMMEND_FILTER);
    btn.style.borderColor = RECOMMEND_FILTER ? '#e0447c' : 'transparent';
  }
  btn.addEventListener('click', function () {
    RECOMMEND_FILTER = !RECOMMEND_FILTER;
    render();
    renderList(document.getElementById('search').value);
  });
  render();
  return btn;
}

function renderInterestLegend() {
  const el = document.getElementById('interest-legend');
  el.innerHTML = '';
  el.appendChild(makeStateLegendBtn(2, '永久保存版'));
  el.appendChild(makeStateLegendBtn(1, 'お気に入り'));
  el.appendChild(makePinLegendBtn());
  el.appendChild(makeRecommendLegendBtn());
}

document.getElementById('search').addEventListener('input', e => renderList(e.target.value));
renderInterestLegend();
renderList('');
</script>
