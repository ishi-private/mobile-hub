  .site-btn.dash:hover { opacity: 0.75; }
  .site-btn.empty { background: #444 !important; opacity: 0.5;

  .g-cnt { margin-left: auto; font-size: 0.7rem; color: #444; }

  .series-sec-hdr .g-cnt { margin-left: auto; font-size: 0.7rem; color: #444; }

const WEB_ANIME_IDS = new Set([7022]); // 衛宮さんちの今日のごはん（webアニメで特殊なため分離）
function isMovieEntry(a) { return /劇場版|^映画/.test(a.title || ''); }
function isWebAnimeEntry(a) { return WEB_ANIME_IDS.has(a.anime_db_id); }

function splitGroupsByTier(groups) {
  const normal = [];
  const webMap = new Map();
  const movieMap = new Map();
  groups.forEach(g => {
    const rest = [];
    g.entries.forEach(a => {
      if (isWebAnimeEntry(a)) {
        if (!webMap.has(g.base)) webMap.set(g.base, { ...g, entries: [] });
        webMap.get(g.base).entries.push(a);
      } else if (isMovieEntry(a)) {
        if (!movieMap.has(g.base)) movieMap.set(g.base, { ...g, entries: [] });
        movieMap.get(g.base).entries.push(a);
      } else {
        rest.push(a);
      }
    });
    if (rest.length > 0) normal.push({ ...g, entries: rest });
  });
  return { normal, web: [...webMap.values()], movie: [...movieMap.values()] };
}

const TIERS = splitGroupsByTier(GROUPS);

// ポスタービュー専用の表示順（グループ単位でシャッフル）。デフォルトでシャッフル済みの状態で表示する。
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let POSTER_ORDER = {
  normal: shuffleArray(TIERS.normal),
  web: shuffleArray(TIERS.web),
  movie: shuffleArray(TIERS.movie),
};

function reshufflePoster() {

    movie: shuffleArray(TIERS.movie),
  };
  renderList(document.getElementById('search').value);
}

function makeSiteBtns(sites, cls) {
  const frag = document.createDocumentFragment();
  const confirmed = (sites || []).filter(s => s.confirmed === true && !s.no_episodes);
  const empty     = (sites || []).filter(s => s.confirmed === true && s.no_episodes);
  const pending   = (sites || []).filter(s => s.confirmed === false && s.url);
  if (!confirmed.length && !empty.length && !pending.length) {
    if (cls !== 'img-btn') {
      const sp = document.createElement('span');
      sp.className = 'no-sites';
      sp.textContent = 'サイト未設定';
      frag.appendChild(sp);
    }
    return frag;
  }
  confirmed.forEach(s => {
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = cls;
    a.style.background = s.color || '#555';
    a.textContent = (cls === 'img-btn' ? '' : '▶ ') + s.label;
    frag.appendChild(a);
  });
  empty.forEach(s => {
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = cls + ' empty';
    a.title = '配信話数なし（ページはあるが空）';
    a.textContent = (cls === 'img-btn' ? '' : '▶ ') + s.label;
    frag.appendChild(a);
  });
  pending.forEach(s => {
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = cls + ' pending';
    a.title = '動画再生未確認 - クリックして確認';
    a.textContent = '？ ' + s.label;
    frag.appendChild(a);
  });
  return frag;
}

const DOMAINS = [

function makeDomainCell(sites, domain) {
  const td = document.createElement('td');
  td.className = 'domain-cell';
  const found = (sites || []).find(s => s.label === domain.label);
  const a = document.createElement('a');
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  if (found && found.confirmed === true && found.no_episodes) {
    a.href = found.url;
    a.className = 'site-btn empty';
    a.textContent = '▶';
    a.title = domain.label + ': 配信話数なし（ページはあるが空）';
  } else if (found && found.confirmed === true) {
    a.href = found.url;
    a.className = 'site-btn';
    a.style.background = found.color || domain.color;
    a.textContent = '▶';
    a.title = domain.label;
  } else if (found && found.confirmed === false && found.url) {
    a.href = found.url;
    a.className = 'site-btn pending';
    a.textContent = '？';
    a.title = domain.label + ': 動画再生未確認 - クリックして確認';
  } else {
    a.href = domain.top;
    a.className = 'site-btn dash';
    a.textContent = '－';
    a.title = domain.label + ': リンク未登録（トップページを開く）';
  }
  td.appendChild(a);
  return td;
}

function makeImgCard(anime) {
  const card = document.createElement('div');

    const img = document.createElement('img');
    img.className = 'poster';

    img.alt = anime.title_ja || anime.title;

function makeGroupHdr(g, cls, extraClass, useShortBase) {
  const isOpen = EXPANDED.has(g.base);
  const hdr = document.createElement('div');

  const arrow = document.createElement('span');
  arrow.className = 'g-arrow' + (isOpen ? ' open' : '');
  arrow.textContent = '▶';
  const label = document.createElement('span');
  label.textContent = useShortBase ? (g.short_base || g.base) : g.base;
  const cnt = document.createElement('span');
  cnt.className = 'g-cnt';
  cnt.textContent = g.entries.length + '作品';
  hdr.appendChild(arrow); hdr.appendChild(label); hdr.appendChild(cnt);
  hdr.addEventListener('click', () => toggleGroup(g.base));
  return hdr;
}

function buildPosterGrid(groups, q) {
  const grid = document.createElement('div');
  grid.className = 'poster-flat-grid';
  groups.forEach(g => {
    if (g.entries.length > 1 && !(q && g.entries.length === 1)) {
      grid.appendChild(makeGroupCoverCard(g));
    } else {
      g.entries.forEach(a => grid.appendChild(makePosterCard(a)));
    }
  });
  return grid;
}

function buildImageSection(groups, q) {
  const frag = document.createDocumentFragment();
  if (q) {
    const grid = document.createElement('div');
    grid.className = 'flat-grid';
    groups.forEach(g => g.entries.forEach(a => grid.appendChild(makeImgCard(a))));
    frag.appendChild(grid);
  } else {
    const singles = [];
    groups.forEach(g => {
      if (g.entries.length > 1) {
        const isOpen = EXPANDED.has(g.base);
        const sec = document.createElement('div');
        sec.className = 'series-sec';
        sec.appendChild(makeGroupHdr(g, 'series-sec-hdr', null, false));
        if (isOpen) {
          const grid = document.createElement('div');
          grid.className = 'series-sec-grid';
          g.entries.forEach(a => grid.appendChild(makeImgCard(a)));
          sec.appendChild(grid);
        }
        frag.appendChild(sec);
      } else {
        singles.push(g.entries[0]);
      }
    });
    if (singles.length > 0) {
      const sg = document.createElement('div');
      sg.className = 'singles-grid';
      singles.forEach(a => sg.appendChild(makeImgCard(a)));
      frag.appendChild(sg);
    }
  }
  return frag;
}

function appendTextRows(tbody, groups, q) {
  groups.forEach(g => {
    if (g.entries.length > 1 && !q) {
      const isOpen = EXPANDED.has(g.base);
      tbody.appendChild(makeGroupRow(g));
      if (isOpen) {
        g.entries.forEach(a => tbody.appendChild(makeTextRow(a, true)));
      }
    } else {
      g.entries.forEach(a => tbody.appendChild(makeTextRow(a, false)));
    }
  });
}

function renderList(query) {
  const q = query.trim().toLowerCase();
  const groups      = filterGroupList(TIERS.normal, q);
  const webGroups   = filterGroupList(TIERS.web, q);
  const movieGroups = filterGroupList(TIERS.movie, q);
  const countEntries = gs => gs.reduce((s, g) => s + g.entries.length, 0);
  const total = countEntries(groups) + countEntries(webGroups) + countEntries(movieGroups);
  document.getElementById('count').textContent =
    total === ANIME.length ? `${ANIME.length} 作品` : `${total} / ${ANIME.length} 作品`;

  const container = document.getElementById('list');
  container.innerHTML = '';

  if (VIEW === 'poster') {
    document.getElementById('site-legend').style.display = 'flex';
    renderPosterLegend();
    container.className = 'poster';
    // 複数シーズンは1枚の代表カードにまとめ、クリックでシーズン選択メニューを開く。
    // 検索中でグループが1件に絞られた場合は個別カードを直接表示する。
    // 表示順はPOSTER_ORDER（シャッフル済み）を使う。他ビューの並び順には影響しない。
    const posterGroups      = filterGroupList(POSTER_ORDER.normal, q);
    const posterWebGroups   = filterGroupList(POSTER_ORDER.web, q);
    const posterMovieGroups = filterGroupList(POSTER_ORDER.movie, q);
    container.appendChild(buildPosterGrid(posterGroups, q));
    if (posterWebGroups.length > 0) {
      container.appendChild(makeTierDivider('📺 webアニメ'));
      container.appendChild(buildPosterGrid(posterWebGroups, q));
    }
    if (posterMovieGroups.length > 0) {
      container.appendChild(makeTierDivider('🎬 劇場版'));
      container.appendChild(buildPosterGrid(posterMovieGroups, q));
    }
  } else if (VIEW === 'image') {
    document.getElementById('site-legend').style.display = 'none';
    container.className = 'img';
    container.appendChild(buildImageSection(groups, q));
    if (webGroups.length > 0) {
      container.appendChild(makeTierDivider('📺 webアニメ'));
      container.appendChild(buildImageSection(webGroups, q));
    }
    if (movieGroups.length > 0) {
      container.appendChild(makeTierDivider('🎬 劇場版'));
      container.appendChild(buildImageSection(movieGroups, q));
    }
  } else {
    document.getElementById('site-legend').style.display = 'none';
    container.className = 'text';
    const table = document.createElement('table');
    table.className = 'anime-table';
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const titleTh = document.createElement('th');
    titleTh.textContent = '作品';
    headRow.appendChild(titleTh);
    DOMAINS.forEach(d => {
      const th = document.createElement('th');
      th.className = 'domain-th';
      th.textContent = d.label;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    appendTextRows(tbody, groups, q);
    if (webGroups.length > 0) {
      tbody.appendChild(makeTierDividerRow('📺 webアニメ'));
      appendTextRows(tbody, webGroups, q);
    }
    if (movieGroups.length > 0) {
      tbody.appendChild(makeTierDividerRow('🎬 劇場版'));
      appendTextRows(tbody, movieGroups, q);
    }
    table.appendChild(tbody);
    container.appendChild(table);
  }
}

document.getElementById('search').addEventListener('input', e => renderList(e.target.value));
renderList('');
</script>
</body>
