// ── URL 構築 ──────────────────────────────────────────────────────────────
function buildUrl(anime, site) {
  return anime[site + "_url"] || "#";
}

// ── UI 部品 ───────────────────────────────────────────────────────────────
function makeBtnRow(anime, siteIds) {
  const row = document.createElement("div");
  row.className = "btn-group";
  siteIds.forEach(site => {
    const color = SITE_COLORS[site];
    if (!color) return;
    const url = buildUrl(anime, site);
    if (url === "#") return;
    const btn = document.createElement("a");
    btn.href      = url;
    btn.target    = "_blank";
    btn.rel       = "noopener noreferrer";
    btn.className = "site-btn";
    btn.style.background = color;
    btn.textContent = "▶ " + (SITE_LABELS[site] || site);
    row.appendChild(btn);
  });
  return row;
}

function makeCard(anime) {
  const card = document.createElement("div");
  card.className = "card";

  const titleDiv = document.createElement("div");
  titleDiv.className = "card-title";
  titleDiv.innerHTML =
    `<div class="ja" title="${anime.title_ja}">${anime.title_ja}</div>` +
    `<div class="en">${anime.title}</div>` +
    (anime.note ? `<div class="note">${anime.note}</div>` : "");

  // streaming 上段 / その他（AT・Nyaa）下段
  const streamingRow = makeBtnRow(anime, anime.sites.filter(s => STREAMING_SITES.includes(s)));
  const otherRow     = makeBtnRow(anime, OTHER_SITES.filter(s => anime.sites.includes(s)));

  card.appendChild(titleDiv);
  if (streamingRow.children.length > 0) card.appendChild(streamingRow);
  if (otherRow.children.length     > 0) card.appendChild(otherRow);
  return card;
}

function makeSeriesGroup(series, animeList) {
  const details = document.createElement("details");
  details.className = "series-group";
  details.open = true;

  const summary = document.createElement("summary");
  summary.className = "series-summary";
  const enSpan = series.title_en !== series.title_ja
    ? `<span class="series-en">${series.title_en}</span>` : "";
  summary.innerHTML =
    `<span class="series-icon">&#9658;</span>` +
    `<span class="series-name">${series.title_ja}${enSpan}</span>` +
    `<span class="series-badge">${animeList.length}</span>`;

  const body = document.createElement("div");
  body.className = "series-body";
  animeList.forEach(a => body.appendChild(makeCard(a)));

  details.appendChild(summary);
  details.appendChild(body);
  return details;
}

function renderList(query) {
  const q = query.trim().toLowerCase();
  const container = document.getElementById("list");
  container.innerHTML = "";

  if (q) {
    const filtered = ANIME.filter(a =>
      a.title.toLowerCase().includes(q) ||
      a.title_ja.toLowerCase().includes(q) ||
      (a.note || "").toLowerCase().includes(q)
    );
    document.getElementById("count").textContent =
      `${filtered.length} / ${ANIME.length} 作品`;
    filtered.forEach(a => container.appendChild(makeCard(a)));
    return;
  }

  document.getElementById("count").textContent = `${ANIME.length} 作品`;

  const slugToAnime = {};
  ANIME.forEach(a => { slugToAnime[a.slug] = a; });

  const inSeries = new Set();
  SERIES.forEach(series => {
    const animeList = series.slugs.map(s => slugToAnime[s]).filter(Boolean);
    if (animeList.length === 0) return;
    animeList.forEach(a => inSeries.add(a.slug));
    container.appendChild(makeSeriesGroup(series, animeList));
  });

  ANIME.filter(a => !inSeries.has(a.slug))
       .forEach(a => container.appendChild(makeCard(a)));
}

    animeflv:     "streaming (ES)",
    monoschinos:  "streaming (ES)",
    miruro:       "streaming",
    nyaa:         "torrent",
  };
  Object.entries(SITE_COLORS).forEach(([id, color]) => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML =
      `<div class="legend-dot" style="background:${color}"></div>` +
      `<span>${SITE_LABELS[id]}</span>` +
      `<span class="legend-sub">${meta[id] || ""}</span>`;
    el.appendChild(item);
  });
}

// ── 初期化 ────────────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", e => renderList(e.target.value));
renderLegend();
renderList("");
</script>
</body>
