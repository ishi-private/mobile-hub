<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サイト確認</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: #0f0f13; color: #e2e2e2; min-height: 100vh; padding: 0 0 32px; }
  .controls { max-width: var(--page-max-width); margin: 0 auto; display: flex; gap: 10px;
               align-items: center; flex-wrap: wrap; }
  #search-wrap { flex: 1; min-width: 180px; position: relative; }
  #search { width: 100%; padding: 10px 14px 10px 36px; font-size: 0.92rem;
             background: #1c1c24; border: 1px solid #333; border-radius: 8px;
             color: #e2e2e2; outline: none; }
  #search:focus { border-color: #555; }
  #search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
                  color: #666; font-size: 0.92rem; pointer-events: none; }

  .toggle-item { display: flex; align-items: center; gap: 6px; cursor: pointer;
                  font-size: 0.74rem; color: #667; user-select: none; white-space: nowrap; }
  .toggle-item input { accent-color: #4ade80; }

  /* ── サイト凡例 ── */
  #site-legend { max-width: var(--page-max-width); margin: 10px auto 12px;
                  display: flex; flex-wrap: wrap; gap: 8px; }
  #site-legend .legend-item { display: flex; align-items: center; gap: 5px;
                                font-size: 0.7rem; color: #888; }
  #site-legend .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  #count { max-width: var(--page-max-width); margin: 0 auto 6px; font-size: 0.74rem; color: #555; }
  #unmatched-note { max-width: var(--page-max-width); margin: 0 auto 10px; font-size: 0.68rem; color: #665533; }
  #list { max-width: var(--page-max-width); margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
           padding: 0 16px; }

  /* ── カード ── */
  .card { background: #1c1c24; border: 1px solid #2a2a35; border-radius: 8px;
           padding: 10px 12px; display: flex; gap: 12px; align-items: flex-start;
           transition: border-color 0.15s; }
  .card:hover { border-color: #444; }
  .card-thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover;
                 background: #12121a; flex-shrink: 0; }
  .card-thumb.no-img { display: flex; align-items: center; justify-content: center;
                         color: #333; font-size: 1.3rem; }
  .card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .card-title { font-size: 0.9rem; line-height: 1.35; }
  .card-title .ja { color: #c8c8d8; }
  .card-title .en { color: #667; font-size: 0.74rem; }

  .site-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .site-pill { display: inline-flex; align-items: center; gap: 4px;
                padding: 3px 9px; border-radius: 5px; font-size: 0.7rem; font-weight: 600;
                text-decoration: none; color: #fff; white-space: nowrap; transition: opacity 0.15s; }
  .site-pill:hover { opacity: 0.85; }
  .site-pill.q-hd   { }
  .site-pill.q-sd   { opacity: 0.88; }
  .site-pill.q-unknown { opacity: 0.75; }
  .site-pill.q-unchecked { opacity: 0.55; }
  .site-pill.q-fail { background: #3a1414 !important; color: #d88; opacity: 0.8; }
  .site-pill.manual { background: transparent !important; border: 1px dashed currentColor; color: #999; }
  .site-pill .qtag { font-size: 0.62rem; font-weight: 700; padding: 0 4px; border-radius: 3px;
                       background: rgba(0,0,0,0.28); }

  .no-link-note { font-size: 0.74rem; color: #665; font-style: italic; }
  .info-row { font-size: 0.68rem; color: #556; }
  .info-row a { color: #778; text-decoration: none; }
  .info-row a:hover { color: #aab; }
</style>
</head>
<body>
<div class="site-header-sticky">
  <nav id="site-nav" class="page-nav"></nav>
  <script src="../shared/nav.js?v=20260924"></script>
  <div class="controls">
    <div id="search-wrap">
      <span id="search-icon">🔍</span>
      <input id="search" type="text" placeholder="アニメを検索..." autofocus>
    </div>
    <label class="toggle-item">
      <input type="checkbox" id="toggle-hide-nolink"> リンク無しを隠す
    </label>
  </div>
  <div id="site-legend"></div>
</div>

<div id="count"></div>
<div id="unmatched-note"></div>
<div id="list"></div>

<script src="../site-monitor/data/now_page_data.js"></script>
<script>
const DATA = window.NOW_PAGE_DATA || [];
const SITE_META = window.NOW_PAGE_SITE_META || {};

const QUALITY_LABEL = { hd: "HD", sd: "SD", unknown: "?", unchecked: "", manual: "手動" };

function qualityClass(site) {
  if (site.manual) return "manual";
  if (site.quality === "unchecked") return "q-unchecked";
  if (site.playable === false) return "q-fail";
  if (site.quality === "hd") return "q-hd";
  if (site.quality === "sd") return "q-sd";
  return "q-unknown";
}

function makeSitePill(site) {
  const a = document.createElement("a");
  a.href = site.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.className = "site-pill " + qualityClass(site);
  if (!site.manual) a.style.background = site.color;
  else a.style.color = site.color;
  const qtag = site.manual ? "手動" :
    site.quality === "unchecked" ? "" :
    (site.playable === false ? "✕" : QUALITY_LABEL[site.quality] || "");
  a.innerHTML = `▶ ${site.label}` + (qtag ? ` <span class="qtag">${qtag}</span>` : "");
  a.title = site.manual ? "手動確認済みリンク（自動検証対象外）" :
    site.quality === "unchecked" ? "リンク発見済み・再生確認は未実施" :
    site.playable === false ? "再生確認に失敗しました" :
    site.quality === "hd" ? "実測: 再生可・HD画質" :
    site.quality === "sd" ? "実測: 再生可・SD画質" :
    "実測: 再生可・画質は不明";
  return a;
}

function makeCard(a) {
  const card = document.createElement("div");
  card.className = "card";

  if (a.thumbnail) {
    const img = document.createElement("img");
    img.className = "card-thumb";
    img.src = a.thumbnail;
    img.alt = a.title_ja;
    img.onerror = () => { img.outerHTML = '<div class="card-thumb no-img">📺</div>'; };
    card.appendChild(img);
  } else {
    const ph = document.createElement("div");
    ph.className = "card-thumb no-img";
    ph.textContent = "📺";
    card.appendChild(ph);
  }

  const body = document.createElement("div");
  body.className = "card-body";

  const titleDiv = document.createElement("div");
  titleDiv.className = "card-title";
  titleDiv.innerHTML = `<div class="ja">${a.title_ja}</div>` +
    (a.title && a.title !== a.title_ja ? `<div class="en">${a.title}</div>` : "");
  body.appendChild(titleDiv);

  if (a.sites.length > 0) {
    const row = document.createElement("div");
    row.className = "site-row";
    a.sites.forEach(s => row.appendChild(makeSitePill(s)));
    body.appendChild(row);
  } else {
    const note = document.createElement("div");
    note.className = "no-link-note";
    note.textContent = "視聴できるサイトが見つかっていません";
    body.appendChild(note);
  }

  const infoRow = document.createElement("div");
  infoRow.className = "info-row";
  infoRow.innerHTML = `<a href="${a.animatetimes_url}" target="_blank" rel="noopener noreferrer">AnimateTimes（作品情報）</a>`;
  body.appendChild(infoRow);

  card.appendChild(body);
  return card;
}

function renderList() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const hideNoLink = document.getElementById("toggle-hide-nolink").checked;
  const container = document.getElementById("list");
  container.innerHTML = "";

  let items = DATA;
  if (q) {
    items = items.filter(a =>
      (a.title_ja || "").toLowerCase().includes(q) ||
      (a.title || "").toLowerCase().includes(q));
  }
  if (hideNoLink) {
    items = items.filter(a => a.sites.length > 0);
  }

  document.getElementById("count").textContent = `${items.length} / ${DATA.length} 作品`;
  const frag = document.createDocumentFragment();
  items.forEach(a => frag.appendChild(makeCard(a)));
  container.appendChild(frag);
}

function renderLegend() {
  const el = document.getElementById("site-legend");
  Object.entries(SITE_META).forEach(([id, meta]) => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `<div class="legend-dot" style="background:${meta.color}"></div><span>${meta.label}</span>`;
    el.appendChild(item);
  });
}

document.getElementById("search").addEventListener("input", renderList);
document.getElementById("toggle-hide-nolink").addEventListener("change", renderList);
renderLegend();
renderList();
</script>
</body>
</html>
