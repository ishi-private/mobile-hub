<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劇場版ガイド</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: #0a0a0e; color: #e2e2e2; min-height: 100vh; }

  .page-nav a { color: #556; text-decoration: none; }
  .page-nav a:hover { color: #999; }
  .page-nav .sep { color: #2a2a35; }
  .page-nav .current { color: #bbb; font-weight: 600; }

  .controls { max-width: var(--page-max-width); margin: 0 auto;
                   display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  select, input[type="text"] {
    padding: 7px 11px; background: #16161e; border: 1px solid #2a2a3a;
    border-radius: 7px; color: #c8c8d8; font-size: 0.85rem; outline: none;
  }
  select:focus, input:focus { border-color: #4a4a6a; }
  #year-select { min-width: 100px; }
  #search-wrap { flex: 1; min-width: 160px; position: relative; }
  #search { width: 100%; padding-left: 32px; }
  #search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
                  color: #556; font-size: 0.82rem; pointer-events: none; }
  #sort-select { min-width: 130px; color: #778; }

  /* ── 年ナビ（←select→） ── */
  .year-nav { display: flex; align-items: center; gap: 4px; }
  .ynav-btn { width: 26px; height: 28px; border: 1px solid #2a2a3a; border-radius: 6px;
               background: #16161e; color: #668; font-size: 0.8rem; cursor: pointer;
               display: flex; align-items: center; justify-content: center;
               transition: background 0.1s; user-select: none; flex-shrink: 0; }
  .ynav-btn:hover { background: #22223a; color: #aab; }
  .ynav-btn:active { background: #2a2a44; }

  .toggles { display: flex; gap: 10px; align-items: center; margin-left: auto; }
  .toggle-item { display: flex; align-items: center; gap: 6px; cursor: pointer;
                  font-size: 0.74rem; color: #667; user-select: none; white-space: nowrap; }
  .toggle-item:hover { color: #99a; }
  .sw { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw-track { position: absolute; inset: 0; background: #22222e;
               border-radius: 9px; border: 1px solid #333; transition: background 0.2s; }
  .sw-thumb { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
               background: #556; border-radius: 50%; transition: transform 0.2s, background 0.2s; }
  .sw input:checked ~ .sw-track { background: #1e3050; border-color: #3a5a80; }
  .sw input:checked ~ .sw-thumb { transform: translateX(16px); background: #5599cc; }

  #genre-wrap { max-width: var(--page-max-width); margin: 10px auto 0;
                 display: none; gap: 5px; flex-wrap: wrap; padding: 0 16px; }
  body.show-filter #genre-wrap { display: flex; }
  .genre-btn { padding: 3px 12px; border: 1px solid #242434; border-radius: 12px;
                font-size: 0.69rem; cursor: pointer; background: #13131c; color: #667;
                transition: all 0.12s; white-space: nowrap; }
  .genre-btn:hover { border-color: #3a3a5a; color: #99a; }
  .genre-btn.active { background: #162030; border-color: #305070; color: #6699cc; }

  .content { padding: 0 16px 32px; }
  #count { max-width: var(--page-max-width); margin: 0 auto 10px; font-size: 0.74rem; color: #3a3a4a; }

  #grid { max-width: var(--page-max-width); margin: 0 auto;
           display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }

  .card { background: #111119; border: 1px solid #1e1e28; border-radius: 8px;
           overflow: hidden; display: flex; flex-direction: column;
           transition: border-color 0.15s, transform 0.15s; }
  .card:hover { border-color: #36364a; transform: translateY(-2px); }

  .thumb-link { display: block; text-decoration: none; flex-shrink: 0; }
  .thumb-wrap { aspect-ratio: 16/9; overflow: hidden; background: #0d0d16; position: relative; }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block;
                     transition: opacity 0.25s; }
  .thumb-wrap img.loading { opacity: 0; }
  .thumb-wrap img.loaded  { opacity: 1; }
  .no-thumb { width: 100%; height: 100%; display: flex; align-items: center;
               justify-content: center; color: #2a2a3a; font-size: 1.8rem; }
  .thumb-link:hover .thumb-wrap img { opacity: 0.85; }

  .fav-star { position: absolute; top: 5px; left: 5px; z-index: 2;
               width: 24px; height: 24px; border: none; border-radius: 50%;
               background: rgba(10,10,20,0.72); backdrop-filter: blur(4px);
               color: #556; font-size: 0.95rem; cursor: pointer;
               display: flex; align-items: center; justify-content: center;
               transition: transform 0.1s; }
  .fav-star:hover { transform: scale(1.15); }
  .list-fav-star { flex-shrink: 0; width: 22px; height: 22px; border: none; background: none;
                     color: #445; font-size: 0.95rem; cursor: pointer;
                     display: flex; align-items: center; justify-content: center;
                     transition: transform 0.1s; }
  .list-fav-star:hover { transform: scale(1.15); }

  .card-body { padding: 8px 9px 9px; display: flex; flex-direction: column; gap: 5px; }
  .card-title { font-size: 0.8rem; color: #c8c8d8; line-height: 1.45;
                 display: -webkit-box; -webkit-line-clamp: 2;
                 -webkit-box-orient: vertical; overflow: hidden; }
  .card-date { font-size: 0.61rem; color: #445; }

  .tag-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 0.6rem; padding: 2px 6px; border-radius: 8px; }
  .tag-genre { background: #0c1824; color: #447799; border: 1px solid #182840; }

  .at-area { display: none; }
  .at-btn { display: block; text-align: center; text-decoration: none;
             background: #1c1610; border: 1px solid #362a18; border-radius: 6px;
             color: #c07830; font-size: 0.69rem; font-weight: 600; padding: 5px 0;
             transition: background 0.12s; }
  .at-btn:hover { background: #261e14; border-color: #4a3820; }

  .view-toggle { display: flex; gap: 3px; margin-left: 4px; }
  .vt-btn { width: 28px; height: 28px; border: 1px solid #2a2a3a; border-radius: 6px;
             background: #16161e; color: #3a3a52; font-size: 0.88rem; cursor: pointer;
             display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
  .vt-btn:hover { border-color: #4a4a6a; color: #99a; }
  .vt-btn.active { background: #1a2a3a; border-color: #2a4a6a; color: #6699cc; }

  #grid.list-mode { display: block; }
  .list-item { display: flex; align-items: center; gap: 10px; padding: 7px 4px;
                border-bottom: 1px solid #111118; }
  .list-item:hover { background: #0d0d16; }
  .list-title { flex: 1; font-size: 0.81rem; color: #b0b0c4; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  .list-title:hover { color: #8ab4e0; }
  .list-date { flex-shrink: 0; font-size: 0.65rem; color: #556; width: 78px; text-align: right; }

  #load-more-wrap { max-width: var(--page-max-width); margin: 0 auto; padding: 12px 16px 28px; text-align: center; }
  #load-more-btn { padding: 7px 28px; border: 1px solid #2a2a3a; border-radius: 8px;
                    background: #0e0e18; color: #445; font-size: 0.8rem; cursor: pointer;
                    transition: all 0.12s; }
  #load-more-btn:hover { border-color: #4a4a6a; color: #778; }

  #loading { text-align: center; color: #333; padding: 80px; grid-column: 1/-1; font-size: 0.88rem; }
</style>
</head>
<body>

<div class="site-header-sticky">
  <nav id="site-nav" class="page-nav"></nav>
  <script src="../shared/nav.js?v=20260924"></script>
  <div class="controls">
    <div class="year-nav">
      <button class="ynav-btn" id="btn-yr-back" title="1年前 (←)">◀</button>
      <select id="year-select"></select>
      <button class="ynav-btn" id="btn-yr-fwd" title="1年後 (→)">▶</button>
    </div>

    <div id="search-wrap">
      <span id="search-icon">🔍</span>
      <input id="search" type="text" placeholder="タイトルで絞り込み...">
    </div>
    <select id="sort-select">
      <option value="date-desc">公開日順（新しい順）</option>
      <option value="date-asc">公開日順（古い順）</option>
      <option value="title">タイトル順</option>
    </select>

    <div class="view-toggle">
      <button class="vt-btn active" data-mode="grid" title="グリッド表示">⊞</button>
      <button class="vt-btn" data-mode="list" title="リスト表示">≡</button>
    </div>
    <div class="toggles">
      <label class="toggle-item" title="ジャンルフィルターを表示">
        <span class="sw">
          <input type="checkbox" id="toggle-filter">
          <span class="sw-track"></span><span class="sw-thumb"></span>
        </span>フィルター
      </label>
      <label class="toggle-item" title="全期間モード：年をまたいで横断表示">
        <span class="sw">
          <input type="checkbox" id="toggle-allperiod">
          <span class="sw-track"></span><span class="sw-thumb"></span>
        </span>全期間
      </label>
    </div>
  </div>
  <div id="genre-wrap"></div>
</div>

<div class="content">
  <div id="count"></div>
  <div id="grid"><div id="loading">データ読み込み中...</div></div>
</div>
<div id="load-more-wrap">
  <button id="load-more-btn" style="display:none"></button>
</div>

<script src="../anime-db/data/anime_guide_data.js?v=20260925"></script>
<script src="../shared/favorites-data.js"></script>
<script src="../shared/favorites-local-sync.js"></script>
<script src="../shared/favorites.js?v=20260924"></script>
<script src="../shared/search-aliases.js"></script>
<script>
if (typeof ANIME_GUIDE_DATA === "undefined") {
  document.getElementById("loading").textContent =
    "anime_guide_data.js が見つかりません。step12_build_guide_data.py を実行してください。";
  throw new Error("no data");
}

// 劇場版のみを対象にする
const MOVIES = ANIME_GUIDE_DATA.anime.filter(a => a.is_movie);

// ── 状態 ────────────────────────────────────────────────────────────────────
let currentYear   = null;
let activeGenres  = new Set();
let sortMode      = "date-desc";
let viewMode      = "grid";
let filterMode    = "year";  // "year" | "all"
let _flatItems    = [];
let _renderOffset = 0;
const RENDER_BATCH = 100;

function getYear(a) {
  const m = (a.primary_season || "").match(/^(\d{4})/);
  return m ? parseInt(m[1]) : null;
}

// ── 年リスト構築（昇順） ─────────────────────────────────────────────────────
const allYears = [...new Set(MOVIES.map(getYear).filter(y => y !== null))].sort((a, b) => a - b);

const yrSel = document.getElementById("year-select");
allYears.forEach(y => {
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = `${y}年`;
  yrSel.appendChild(opt);
});

const TODAY_YEAR = new Date().getFullYear();
const defaultYear = allYears.includes(TODAY_YEAR) ? TODAY_YEAR : allYears[allYears.length - 1];
yrSel.value = defaultYear;
currentYear = defaultYear;

function selectYear(y) {
  if (!allYears.includes(y)) return;
  currentYear = y;
  yrSel.value = y;
  if (filterMode === "year" && document.getElementById("toggle-filter").checked) {
    buildGenreButtons(y);
  }
  render();
}
yrSel.addEventListener("change", () => selectYear(Number(yrSel.value)));

function moveYear(delta) {
  if (filterMode === "all") return;
  const idx = allYears.indexOf(currentYear);
  const next = allYears[idx + delta];
  if (next !== undefined) selectYear(next);
}
document.getElementById("btn-yr-back").addEventListener("click", () => moveYear(-1));
document.getElementById("btn-yr-fwd").addEventListener("click", () => moveYear(+1));

document.addEventListener("keydown", e => {
  if (document.activeElement === document.getElementById("search")) return;
  if (e.key === "ArrowLeft")  { e.preventDefault(); moveYear(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); moveYear(+1); }
});

// ── トグル ────────────────────────────────────────────────────────────────────
document.getElementById("toggle-filter").addEventListener("change", e => {
  document.body.classList.toggle("show-filter", e.target.checked);
  if (e.target.checked) {
    if (filterMode === "all") buildGenreButtonsAll();
    else buildGenreButtons(currentYear);
  } else {
    activeGenres.clear();
    document.getElementById("genre-wrap").innerHTML = "";
  }
  render();
});

document.getElementById("toggle-allperiod").addEventListener("change", e => {
  filterMode = e.target.checked ? "all" : "year";
  if (document.getElementById("toggle-filter").checked) {
    if (filterMode === "all") buildGenreButtonsAll();
    else buildGenreButtons(currentYear);
  }
  render();
});

// ── ジャンルボタン ────────────────────────────────────────────────────────────
function buildGenreButtons(year) {
  const wrap = document.getElementById("genre-wrap");
  wrap.innerHTML = "";
  activeGenres.clear();
  const genreSet = new Set();
  MOVIES.filter(a => getYear(a) === year).forEach(a => (a.genres || []).forEach(g => genreSet.add(g)));
  [...genreSet].sort().forEach(g => addGenreBtn(wrap, g, g));
}
function buildGenreButtonsAll() {
  const wrap = document.getElementById("genre-wrap");
  wrap.innerHTML = "";
  activeGenres.clear();
  const genreSet = new Set();
  MOVIES.forEach(a => (a.genres || []).forEach(g => genreSet.add(g)));
  [...genreSet].sort().forEach(g => addGenreBtn(wrap, g, g));
}
function addGenreBtn(wrap, label, value) {
  const btn = document.createElement("button");
  btn.className = "genre-btn";
  btn.textContent = label;
  btn.addEventListener("click", () => {
    if (activeGenres.has(value)) { activeGenres.delete(value); btn.classList.remove("active"); }
    else                          { activeGenres.add(value);    btn.classList.add("active"); }
    render();
  });
  wrap.appendChild(btn);
}

// ── お気に入り星ボタン ────────────────────────────────────────────────────────
function makeFavStarBtn(id, className, onUpdate) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = className;
  function render() {
    const state = AnimeFavorites.get(id);
    btn.textContent = AnimeFavorites.STATE_STAR[state];
    btn.style.color = state > 0 ? AnimeFavorites.STATE_COLOR[state] : "";
    btn.title = AnimeFavorites.STATE_LABEL[state] + "（クリックで切替）";
  }
  btn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    AnimeFavorites.cycle(id);
    render();
    if (onUpdate) onUpdate();
  });
  render();
  return btn;
}

// ── カード生成 ────────────────────────────────────────────────────────────────
function makeCard(a) {
  const card = document.createElement("div");
  card.className = "card";

  function applyFavBorder() {
    const state = AnimeFavorites.get(a.id);
    card.style.borderColor = AnimeFavorites.STATE_COLOR[state] || "";
  }

  const thumbLink = document.createElement("a");
  thumbLink.className = "thumb-link";
  thumbLink.href = a.at_url;
  thumbLink.target = "_blank";
  thumbLink.rel = "noopener noreferrer";
  thumbLink.title = a.title;

  const thumbWrap = document.createElement("div");
  thumbWrap.className = "thumb-wrap";
  if (a.thumbnail) {
    const img = document.createElement("img");
    img.className = "loading";
    img.alt = a.title;
    img.loading = "lazy";
    img.src = a.thumbnail;
    img.onload  = () => { img.classList.remove("loading"); img.classList.add("loaded"); };
    img.onerror = () => { thumbWrap.innerHTML = '<div class="no-thumb">🎬</div>'; };
    thumbWrap.appendChild(img);
  } else {
    thumbWrap.innerHTML = '<div class="no-thumb">🎬</div>';
  }
  thumbWrap.appendChild(makeFavStarBtn(a.id, "fav-star", applyFavBorder));
  thumbLink.appendChild(thumbWrap);
  card.appendChild(thumbLink);

  const body = document.createElement("div");
  body.className = "card-body";

  const titleEl = document.createElement("div");
  titleEl.className = "card-title";
  titleEl.title = a.title;
  titleEl.textContent = a.title;
  body.appendChild(titleEl);

  const dateEl = document.createElement("div");
  dateEl.className = "card-date";
  dateEl.textContent = a.primary_season || "?";
  body.appendChild(dateEl);

  if ((a.genres || []).length) {
    const metaArea = document.createElement("div");
    metaArea.className = "tag-row";
    a.genres.forEach(g => {
      const t = document.createElement("span");
      t.className = "tag tag-genre";
      t.textContent = g;
      metaArea.appendChild(t);
    });
    body.appendChild(metaArea);
  }

  const atArea = document.createElement("div");
  atArea.className = "at-area";
  const atBtn = document.createElement("a");
  atBtn.className = "at-btn";
  atBtn.href = a.at_url;
  atBtn.target = "_blank";
  atBtn.rel = "noopener noreferrer";
  atBtn.textContent = "animatetimes →";
  atArea.appendChild(atBtn);
  body.appendChild(atArea);

  card.appendChild(body);
  applyFavBorder();
  return card;
}

function makeListItem(a) {
  const el = document.createElement("div");
  el.className = "list-item";
  function applyFavBorder() {
    el.style.borderBottomColor = AnimeFavorites.STATE_COLOR[AnimeFavorites.get(a.id)] || "";
  }
  el.appendChild(makeFavStarBtn(a.id, "list-fav-star", applyFavBorder));
  const titleEl = document.createElement("a");
  titleEl.className = "list-title";
  titleEl.href = a.at_url;
  titleEl.target = "_blank";
  titleEl.rel = "noopener noreferrer";
  titleEl.title = a.title;
  titleEl.textContent = a.title;
  el.appendChild(titleEl);
  const dateEl = document.createElement("span");
  dateEl.className = "list-date";
  dateEl.textContent = a.primary_season || "";
  el.appendChild(dateEl);
  applyFavBorder();
  return el;
}

// ── 順次読み込み ───────────────────────────────────────────────────────────────
function appendBatch() {
  const grid = document.getElementById("grid");
  const batch = _flatItems.slice(_renderOffset, _renderOffset + RENDER_BATCH);
  const frag = document.createDocumentFragment();
  batch.forEach(a => frag.appendChild(viewMode === "list" ? makeListItem(a) : makeCard(a)));
  grid.appendChild(frag);
  _renderOffset += batch.length;
  const rem = _flatItems.length - _renderOffset;
  const btn = document.getElementById("load-more-btn");
  if (rem > 0) {
    btn.textContent = `さらに読み込む（残り ${rem} 件）`;
    btn.style.display = "";
  } else {
    btn.style.display = "none";
  }
}

// ── 検索（アニメガイドと同じくローマ字/かな表記も対象） ────────────────────────────
function kataToHira(s) { return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function hiraToKata(s) { return s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)); }
function matchesSearch(a, q) {
  if (!q) return true;
  if (a.title.toLowerCase().includes(q)) return true;
  const alias = (window.SEARCH_ALIASES || {})[String(a.id)];
  if (!alias) return false;
  if (alias.romaji && alias.romaji.includes(q)) return true;
  const qHira = kataToHira(q), qKata = hiraToKata(q);
  if (alias.hiragana && alias.hiragana.includes(qHira)) return true;
  if (alias.katakana && alias.katakana.includes(qKata)) return true;
  return false;
}

// ── レンダリング ──────────────────────────────────────────────────────────────
function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  grid.classList.toggle("list-mode", viewMode === "list");

  const isAllYears = filterMode === "all";

  let items = MOVIES.filter(a => {
    if (!isAllYears && !q && getYear(a) !== currentYear) return false;
    if (q && !matchesSearch(a, q)) return false;
    if (activeGenres.size > 0 && ![...activeGenres].some(g => (a.genres || []).includes(g))) return false;
    return true;
  });

  if (sortMode === "date-desc") {
    items.sort((a, b) => (b.primary_season || "").localeCompare(a.primary_season || "") || a.title.localeCompare(b.title, "ja"));
  } else if (sortMode === "date-asc") {
    items.sort((a, b) => (a.primary_season || "").localeCompare(b.primary_season || "") || a.title.localeCompare(b.title, "ja"));
  } else {
    items.sort((a, b) => a.title.localeCompare(b.title, "ja"));
  }

  items.sort((a, b) => AnimeFavorites.get(b.id) - AnimeFavorites.get(a.id));

  const suffix = isAllYears ? "（全期間）" : "";
  document.getElementById("count").textContent = `${items.length} 作品${suffix}`;

  if (items.length === 0) {
    grid.innerHTML = `<div style="color:#333;padding:60px;text-align:center;grid-column:1/-1">該当なし</div>`;
    document.getElementById("load-more-btn").style.display = "none";
    return;
  }

  _flatItems = items; _renderOffset = 0; appendBatch();
}

// ── イベント ──────────────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", render);
document.getElementById("sort-select").addEventListener("change", e => {
  sortMode = e.target.value;
  render();
});
document.querySelectorAll(".vt-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    viewMode = btn.dataset.mode;
    document.querySelectorAll(".vt-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === viewMode));
    render();
  });
});
document.getElementById("load-more-btn").addEventListener("click", appendBatch);

// ── 初期化 ────────────────────────────────────────────────────────────────────
render();
AnimeFavorites.onCloudSync(render);
</script>
</body>
</html>
