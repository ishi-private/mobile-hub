<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品詳細</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: #0f0f13; color: #e2e2e2; min-height: 100vh; padding: 0 0 48px; }
  .content { max-width: var(--page-max-width); margin: 0 auto; padding: 0 16px; }

  .back-link { display: inline-block; margin: 14px 0 4px; font-size: 0.8rem; color: #667; text-decoration: none; }
  .back-link:hover { color: #99a; }

  /* ── ヒーロー ── */
  .hero { display: flex; gap: 20px; padding: 20px 0; align-items: flex-start; flex-wrap: wrap; }
  .hero-thumb { width: 200px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: #1c1c24; }
  .hero-thumb img { width: 100%; display: block; }
  .hero-thumb .no-thumb { width: 100%; aspect-ratio: 2/3; display: flex; align-items: center;
                            justify-content: center; color: #2a2a3a; font-size: 3rem; }
  .hero-body { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 10px; }
  .hero-title { font-size: 1.5rem; color: #f0f0f0; font-weight: 600; }
  .hero-meta { font-size: 0.8rem; color: #778; display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .hero-links a { padding: 6px 13px; border-radius: 6px; font-size: 0.78rem; font-weight: 600;
                    color: #fff; text-decoration: none; background: #3c5be0; transition: opacity 0.15s; }
  .hero-links a:hover { opacity: 0.82; }
  .hero-links a.secondary { background: #33333f; color: #ccc; }

  /* ── セクション共通 ── */
  section.block { margin-top: 32px; }
  section.block h2 { font-size: 1.05rem; color: #ddd; font-weight: 600; margin-bottom: 12px;
                       padding-bottom: 8px; border-bottom: 1px solid #26262f; }
  .prose { font-size: 0.88rem; line-height: 1.85; color: #c8c8ce; white-space: pre-line; }

  table.info-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  table.info-table th, table.info-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #22222b; }
  table.info-table th { color: #778; font-weight: 600; width: 9em; white-space: nowrap; vertical-align: top; }
  table.info-table td { color: #d5d5da; }

  .cast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .cast-card { background: #1c1c24; border: 1px solid #2a2a35; border-radius: 8px; padding: 10px 12px;
                display: flex; gap: 10px; align-items: flex-start; }
  .cast-card .cast-photo { width: 56px; height: 56px; border-radius: 6px; overflow: hidden; flex-shrink: 0;
                             background: #14141b; }
  .cast-card .cast-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cast-card .cast-photo .no-photo { width: 100%; height: 100%; display: flex; align-items: center;
                                       justify-content: center; color: #2a2a3a; font-size: 1.3rem; }
  .cast-card .cast-body { min-width: 0; flex: 1; }
  .cast-card .character { font-size: 0.88rem; color: #eee; font-weight: 600; }
  .cast-card .cv { font-size: 0.78rem; color: #889; margin-top: 2px; }
  .cast-card .note { font-size: 0.72rem; color: #556; margin-top: 4px; }

  .song-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .song-card { background: #1c1c24; border: 1px solid #2a2a35; border-radius: 8px; padding: 10px 12px; }
  .song-card .song-group { font-size: 0.68rem; color: #556; text-transform: uppercase; letter-spacing: 0.04em; }
  .song-card .song-title { font-size: 0.88rem; color: #eee; font-weight: 600; margin-top: 2px; }
  .song-card .song-artist { font-size: 0.78rem; color: #889; margin-top: 2px; }

  .season-group { margin-top: 18px; }
  .season-group:first-child { margin-top: 0; }
  .season-label { font-size: 0.85rem; color: #99a; font-weight: 600; margin-bottom: 8px; }
  .season-note { font-size: 0.74rem; color: #556; margin-bottom: 8px; }
  table.ep-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.ep-table th, table.ep-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #22222b; vertical-align: top; }
  table.ep-table th { color: #667; font-weight: 600; font-size: 0.72rem; }
  table.ep-table td.ep-num { width: 3.2em; color: #667; white-space: nowrap; }
  table.ep-table td.ep-subtitle { width: 13em; color: #eee; font-weight: 600; }
  table.ep-table td.ep-synopsis { color: #b8b8be; }

  .empty-note { margin: 60px auto; text-align: center; color: #556; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="site-header-sticky">
  <nav id="site-nav" class="page-nav"></nav>
  <script src="../shared/nav.js?v=20260923"></script>
</div>

<div class="content">
  <a class="back-link" href="favorites.html">← お気に入りへ戻る</a>
  <div id="body"></div>
</div>

<script src="../anime-db/data/anime_guide_data.js"></script>
<script src="../shared/favorites-data.js"></script>
<script src="../shared/anime-detail-data.js"></script>
<script>
(function () {
  "use strict";

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function resolveCanonicalId(id) {
    const alias = window.ANIME_DETAIL_ALIAS || {};
    return alias[id] || id;
  }

  function getBaseInfo(id) {
    const guide = (ANIME_GUIDE_DATA.anime || []).find(function (a) { return String(a.id) === String(id); });
    if (guide) {
      return {
        title: guide.title,
        thumbnail: guide.thumbnail || null,
        primary_season: guide.primary_season || null,
        episode_text: guide.episode_text || null,
        genres: guide.genres || [],
        at_url: guide.at_url || null,
      };
    }
    const info = (window.FAVORITES_INFO || {})[id];
    if (info) {
      return { title: info.title, thumbnail: info.thumbnail || null, primary_season: null, episode_text: null, genres: [], at_url: null };
    }
    return null;
  }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderHero(base, detail) {
    const hero = el("div", "hero");

    const thumb = el("div", "hero-thumb");
    if (base && base.thumbnail) {
      const img = document.createElement("img");
      img.src = base.thumbnail;
      img.alt = base.title;
      thumb.appendChild(img);
    } else {
      thumb.innerHTML = '<div class="no-thumb">📺</div>';
    }
    hero.appendChild(thumb);

    const body = el("div", "hero-body");
    body.appendChild(el("div", "hero-title", base ? base.title : "（タイトル不明）"));

    const metaParts = [];
    if (base && base.primary_season) metaParts.push(base.primary_season);
    if (base && base.episode_text) metaParts.push(base.episode_text);
    if (base && base.genres && base.genres.length) metaParts.push(base.genres.join(" / "));
    if (metaParts.length) {
      const meta = el("div", "hero-meta");
      metaParts.forEach(function (p) { meta.appendChild(el("span", null, p)); });
      body.appendChild(meta);
    }

    const links = el("div", "hero-links");
    (detail && detail.officialSites || []).forEach(function (s) {
      const a = document.createElement("a");
      a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = s.label || "公式サイト";
      links.appendChild(a);
    });
    if (base && base.at_url) {
      const a = document.createElement("a");
      a.href = base.at_url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.className = "secondary";
      a.textContent = "アニメイトタイムズ";
      links.appendChild(a);
    }
    if (links.children.length) body.appendChild(links);

    hero.appendChild(body);
    return hero;
  }

  function renderBackground(detail) {
    if (!detail.background) return null;
    const sec = el("section", "block");
    sec.appendChild(el("h2", null, "背景・世界観"));
    sec.appendChild(el("div", "prose", detail.background));
    return sec;
  }

  function renderStaff(detail) {
    if (!detail.staff || !detail.staff.length) return null;
    const sec = el("section", "block");
    sec.appendChild(el("h2", null, "スタッフ"));
    const table = document.createElement("table");
    table.className = "info-table";
    detail.staff.forEach(function (s) {
      const tr = document.createElement("tr");
      const th = el("th", null, s.role);
      const td = el("td", null, s.name);
      tr.appendChild(th); tr.appendChild(td);
      table.appendChild(tr);
    });
    sec.appendChild(table);
    return sec;
  }

  function renderCast(detail) {
    if (!detail.cast || !detail.cast.length) return null;
    const sec = el("section", "block");
    sec.appendChild(el("h2", null, "キャスト（声優）"));
    const grid = el("div", "cast-grid");
    detail.cast.forEach(function (c) {
      const card = el("div", "cast-card");

      const photo = el("div", "cast-photo");
      if (c.image) {
        const img = document.createElement("img");
        img.src = c.image;
        img.alt = c.character;
        img.loading = "lazy";
        photo.appendChild(img);
      } else {
        photo.innerHTML = '<div class="no-photo">👤</div>';
      }
      card.appendChild(photo);

      const bodyEl = el("div", "cast-body");
      bodyEl.appendChild(el("div", "character", c.character));
      bodyEl.appendChild(el("div", "cv", "CV: " + c.cv));
      if (c.note) bodyEl.appendChild(el("div", "note", c.note));
      card.appendChild(bodyEl);

      grid.appendChild(card);
    });
    sec.appendChild(grid);
    return sec;
  }

  function renderSongs(detail) {
    if (!detail.songs || !detail.songs.length) return null;
    const sec = el("section", "block");
    sec.appendChild(el("h2", null, "主題歌"));
    const grid = el("div", "song-grid");
    detail.songs.forEach(function (s) {
      const card = el("div", "song-card");
      card.appendChild(el("div", "song-group", s.group + " ／ " + s.type));
      card.appendChild(el("div", "song-title", s.title));
      card.appendChild(el("div", "song-artist", s.artist));
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    return sec;
  }

  function renderEpisodes(detail) {
    if (!detail.seasons || !detail.seasons.length) return null;
    const sec = el("section", "block");
    sec.appendChild(el("h2", null, "各話あらすじ"));
    detail.seasons.forEach(function (season) {
      const group = el("div", "season-group");
      group.appendChild(el("div", "season-label", season.label));
      if (season.note) group.appendChild(el("div", "season-note", season.note));
      const table = document.createElement("table");
      table.className = "ep-table";
      const thead = document.createElement("tr");
      thead.appendChild(el("th", null, "話数"));
      thead.appendChild(el("th", null, "サブタイトル"));
      thead.appendChild(el("th", null, "あらすじ"));
      table.appendChild(thead);
      (season.episodes || []).forEach(function (e) {
        const tr = document.createElement("tr");
        tr.appendChild(el("td", "ep-num", "第" + e.ep + "話"));
        tr.appendChild(el("td", "ep-subtitle", e.subtitle || ""));
        tr.appendChild(el("td", "ep-synopsis", e.synopsis || ""));
        table.appendChild(tr);
      });
      group.appendChild(table);
      sec.appendChild(group);
    });
    return sec;
  }

  function render() {
    const rawId = getParam("id");
    const bodyEl = document.getElementById("body");
    if (!rawId) {
      bodyEl.appendChild(el("div", "empty-note", "作品IDが指定されていません。"));
      return;
    }
    const id = resolveCanonicalId(rawId);
    const base = getBaseInfo(id);
    const detail = (window.ANIME_DETAIL || {})[id];

    document.title = (base ? base.title : "作品詳細") + " | 作品詳細";

    bodyEl.appendChild(renderHero(base, detail));

    if (!detail) {
      bodyEl.appendChild(el("div", "empty-note", "この作品の詳細ページはまだ作成されていません。"));
      return;
    }

    [renderBackground(detail), renderStaff(detail), renderCast(detail), renderSongs(detail), renderEpisodes(detail)]
      .forEach(function (sec) { if (sec) bodyEl.appendChild(sec); });
  }

  render();
})();
</script>
</body>
</html>
