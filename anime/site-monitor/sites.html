  #subtitle { max-width: var(--page-max-width); margin: 0 auto 12px; padding: 0 16px;

                border-radius: 8px; padding: 12px 14px; text-align: center; }
  .stat-num { font-size: 1.5rem; font-weight: 700; color: #ccc; }
  .stat-label { font-size: 0.7rem; color: #666; margin-top: 4px; }

  section { max-width: var(--page-max-width); margin: 0 auto 28px; }
  h2 { font-size: 0.95rem; color: #999; font-weight: 500; margin-bottom: 10px;
        padding-bottom: 6px; border-bottom: 1px solid #222; }

  table { width: 100%; border-collapse: collapse; background: #1c1c24; border-radius: 8px;
           overflow: hidden; font-size: 0.85rem; }
  thead th { text-align: left; padding: 10px 12px; background: #191922; color: #778;
              font-weight: 600; font-size: 0.75rem; }
  tbody td { padding: 10px 12px; border-top: 1px solid #24242e; }
  tbody tr:hover { background: #20202a; }
  .site-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .bar-wrap { width: 100px; height: 6px; background: #26262f; border-radius: 3px; overflow: hidden; }
  .bar { height: 100%; border-radius: 3px; }
  .rate-cell { display: flex; align-items: center; gap: 8px; }
  .num { color: #999; font-variant-numeric: tabular-nums; }

  .excluded-table td { color: #888; }
  .excluded-table .site-name { font-weight: 600; color: #a66; }
  .reason { font-size: 0.78rem; color: #666; }

  .section-footnote { font-size: 0.7rem; color: #444; margin-top: 8px; }

  #hc-search { width: 100%; padding: 10px 14px 10px 36px; font-size: 0.9rem;

             color: #e2e2e2; outline: none; }
  #hc-search:focus { border-color: #555; }
  #hc-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
                  color: #666; font-size: 0.9rem; pointer-events: none; }

  #hc-filter-wrap { max-width: var(--page-max-width); margin: 0 auto 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { padding: 5px 14px; border: 1px solid #333; border-radius: 20px;
                 font-size: 0.75rem; cursor: pointer; background: #1c1c24; color: #888;
                 transition: all 0.15s; }
  .filter-btn:hover { border-color: #555; color: #ccc; }
  .filter-btn.active { background: #2a2a40; border-color: #6060a0; color: #ccd; }

  #hc-count { max-width: var(--page-max-width); margin: 0 auto 10px; font-size: 0.8rem; color: #555; }

  .hc-legend { max-width: var(--page-max-width); margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: #888; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-sub { color: #555; font-size: 0.68rem; }

  #hc-list { max-width: var(--page-max-width); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

  .cat-group { background: #13131e; border: 1px solid #28283a; border-radius: 10px; overflow: hidden; }
  .cat-summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
                  cursor: pointer; list-style: none; user-select: none; }
  .cat-summary::-webkit-details-marker { display: none; }
  .cat-summary::marker { display: none; }
  .cat-summary:hover { background: #191928; }
  .cat-icon { font-size: 0.65rem; color: #556; transition: transform 0.2s; flex-shrink: 0; display: inline-block; }
  details[open] > .cat-summary .cat-icon { transform: rotate(90deg); }
  .cat-name { flex: 1; font-size: 0.97rem; color: #b8b8d4; font-weight: 500; }
  .cat-badge { font-size: 0.72rem; background: #22223a; color: #778; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
  .cat-body { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 6px; }
  .cat-body .card { border-radius: 6px; }

  .card { background: #1c1c24; border: 1px solid #2a2a35; border-radius: 8px;
           padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
           transition: border-color 0.15s; position: relative; overflow: hidden; }
  .card:hover { border-color: #444; }
  .card-left-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .status-badge { flex-shrink: 0; font-size: 1.1rem; line-height: 1; margin-top: 2px; }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-size: 0.97rem; color: #e2e2e2; font-weight: 500; }
  .card-url { font-size: 0.73rem; color: #556; margin-top: 2px;

  .card-url a { color: #6688aa; text-decoration: none; }
  .card-url a:hover { color: #99bbdd; }
  .score-area { flex-shrink: 0; text-align: right; }
  .score-num { font-size: 1.2rem; font-weight: 700; line-height: 1; }
  .score-bar-wrap { width: 60px; height: 4px; background: #222; border-radius: 2px; margin-top: 4px; }
  .score-bar { height: 100%; border-radius: 2px; }
  .score-label { font-size: 0.62rem; color: #555; margin-top: 2px; }

  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 0.68rem; padding: 2px 7px; border-radius: 10px; background: #22223a;
          color: #778; border: 1px solid #333; }
  .tag.ok    { background: #0d2a1a; color: #4a9; border-color: #1a4a2a; }
  .tag.warn  { background: #2a2200; color: #aa8; border-color: #443300; }
  .tag.dead  { background: #2a1111; color: #a55; border-color: #4a1a1a; }
  .tag.player { background: #0d1e2e; color: #46a; border-color: #1a3a5a; }

  .btn-group { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .site-btn { padding: 5px 10px; border: none; border-radius: 5px; font-size: 0.75rem;
               font-weight: 600; cursor: pointer; color: #fff; text-decoration: none;

  .site-btn.mirror { background: #2a2a3a !important; color: #888; font-weight: 400; }

  .card-note { font-size: 0.71rem; color: #555; line-height: 1.5; border-top: 1px solid #222; padding-top: 6px; }
  .dead-note { color: #8a4444; }

  footer { max-width: var(--page-max-width); margin: 0 auto; font-size: 0.7rem; color: #444; text-align: center; }
</style>

// ── 網羅率セクション ─────────────────────────────────────────────────────────
function rateColor(pct) {
  if (pct >= 70) return "#22c55e";
  if (pct >= 40) return "#eab308";
  if (pct >= 15) return "#f97316";
  return "#555";
}

document.getElementById("subtitle").textContent =
  `生成日時: ${COVERAGE.generated_at}　|　総作品数 ${COVERAGE.total_anime} 件`;

const summary = document.getElementById("summary");
[
  { label: "総作品数",       num: COVERAGE.total_anime },
  { label: "リンクあり",     num: COVERAGE.with_any_link },
  { label: "リンクなし",     num: COVERAGE.zero_link },
].forEach(s => {
  const c = document.createElement("div");
  c.className = "stat-card";
  c.innerHTML = `<div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div>`;
  summary.appendChild(c);
});

const covTbody = document.querySelector("#adopted-table tbody");
COVERAGE.adopted.forEach(r => {
  const tr = document.createElement("tr");
  const foundCol = rateColor(r.found_rate);
  const confCol = rateColor(r.confirmed_rate);
  tr.innerHTML = `
    <td><div class="site-name"><span class="dot" style="background:${r.color}"></span>${r.name}</div></td>
    <td class="num">${r.found_count} / ${COVERAGE.total_anime}</td>
    <td><div class="rate-cell"><div class="bar-wrap"><div class="bar" style="width:${r.found_rate}%;background:${foundCol}"></div></div><span class="num">${r.found_rate}%</span></div></td>
    <td><div class="rate-cell"><div class="bar-wrap"><div class="bar" style="width:${r.confirmed_rate}%;background:${confCol}"></div></div><span class="num">${r.confirmed_rate}%</span></div></td>
  `;
  covTbody.appendChild(tr);
});

const exTbody = document.querySelector("#excluded-table tbody");
COVERAGE.excluded.forEach(s => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="site-name">${s.name}</td><td class="reason">${s.reason}</td>`;
  exTbody.appendChild(tr);
});

document.getElementById("footer").textContent =
  "本ページは 10_generate_sites_page.py で再生成できます（網羅率セクションはwatch-config.jsonから自動集計）。";

// ── ヘルスチェックセクション ─────────────────────────────────────────────────
const STATUS_ICON = { ok: "✅", warn: "⚠️", dead: "❌" };

function scoreColor(s) {
  if (s === null || s === 0) return "#444";
  if (s >= 80) return "#22c55e";
  if (s >= 60) return "#84cc16";
  if (s >= 40) return "#eab308";
  if (s >= 20) return "#f97316";
  return "#ef4444";
}

function makeHcCard(site) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.cat = site.cat;
  card.dataset.name = site.name.toLowerCase();
  card.dataset.url = site.url.toLowerCase();

  const bar = document.createElement("div");
  bar.className = "card-left-bar";
  bar.style.background = site.color;
  card.appendChild(bar);

  const head = document.createElement("div");
  head.className = "card-head";

  const statusBadge = document.createElement("div");
  statusBadge.className = "status-badge";
  statusBadge.textContent = STATUS_ICON[site.cat] || "?";

  const info = document.createElement("div");
  info.className = "card-info";
  info.innerHTML =
    `<div class="card-name">${site.name}</div>` +
    `<div class="card-url"><a href="${site.url}" target="_blank" rel="noopener">${site.url}</a>` +
    ` &nbsp;<span style="color:#444;">${site.category} · ${site.lang}</span></div>`;

  const scoreArea = document.createElement("div");
  scoreArea.className = "score-area";
  if (site.score !== null) {
    const sc = site.score;
    const col = scoreColor(sc);
    scoreArea.innerHTML =
      `<div class="score-num" style="color:${col}">${sc}</div>` +
      `<div class="score-bar-wrap"><div class="score-bar" style="width:${Math.min(sc,100)}%;background:${col}"></div></div>` +
      `<div class="score-label">/ 100pt</div>`;
  } else {
    scoreArea.innerHTML = `<div class="score-num" style="color:#444">CF</div><div class="score-label">bot check</div>`;
  }

  head.appendChild(statusBadge);
  head.appendChild(info);
  head.appendChild(scoreArea);
  card.appendChild(head);

  const tagWrap = document.createElement("div");
  tagWrap.className = "card-tags";
  if (site.cat === "ok") tagWrap.innerHTML += `<span class="tag ok">推奨</span>`;
  if (site.cat === "warn") tagWrap.innerHTML += `<span class="tag warn">要確認</span>`;
  if (site.cat === "dead") tagWrap.innerHTML += `<span class="tag dead">廃止</span>`;
  if (site.player) tagWrap.innerHTML += `<span class="tag player">player検出</span>`;
  if (site.anime && site.anime !== "—") tagWrap.innerHTML += `<span class="tag ok">アニメ ${site.anime}</span>`;
  site.tags.forEach(t => { tagWrap.innerHTML += `<span class="tag">${t}</span>`; });
  card.appendChild(tagWrap);

  const btnGroup = document.createElement("div");
  btnGroup.className = "btn-group";
  if (site.cat !== "dead") {
    const mainBtn = document.createElement("a");
    mainBtn.href = site.url;
    mainBtn.target = "_blank";
    mainBtn.rel = "noopener noreferrer";
    mainBtn.className = "site-btn";
    mainBtn.style.background = site.color;
    mainBtn.textContent = "▶ 開く";
    btnGroup.appendChild(mainBtn);
  }
  site.mirrors.forEach(m => {
    const btn = document.createElement("a");
    btn.href = m.url;
    btn.target = "_blank";
    btn.rel = "noopener noreferrer";
    btn.className = "site-btn mirror";
    btn.textContent = m.label;
    btnGroup.appendChild(btn);
  });
  if (btnGroup.children.length > 0) card.appendChild(btnGroup);

  if (site.note) {
    const noteEl = document.createElement("div");
    noteEl.className = "card-note" + (site.cat === "dead" ? " dead-note" : "");
    noteEl.textContent = site.note;
    card.appendChild(noteEl);
  }

  return card;
}

function makeHcCatGroup(cat, sites) {
  const details = document.createElement("details");
  details.className = "cat-group";
  details.open = true;

  const summaryEl = document.createElement("summary");
  summaryEl.className = "cat-summary";
  summaryEl.innerHTML =
    `<span class="cat-icon">▶</span>` +
    `<span class="cat-name">${cat.label}</span>` +
    `<span class="cat-badge">${sites.length}</span>`;

  const body = document.createElement("div");
  body.className = "cat-body";
  sites.forEach(s => body.appendChild(makeHcCard(s)));

  details.appendChild(summaryEl);
  details.appendChild(body);
  return details;
}

let hcCurrentCat = "all";

function renderHcList() {
  const q = document.getElementById("hc-search").value.trim().toLowerCase();
  const container = document.getElementById("hc-list");
  container.innerHTML = "";

  let filtered = HEALTH.sites.filter(s => {
    if (hcCurrentCat !== "all" && s.cat !== hcCurrentCat) return false;
    if (!q) return true;
    return s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q) ||
           s.note.toLowerCase().includes(q) || s.tags.join(" ").includes(q);
  });

  document.getElementById("hc-count").textContent =
    `${filtered.length} / ${HEALTH.sites.length} サイト`;

  if (q || hcCurrentCat !== "all") {
    filtered.forEach(s => container.appendChild(makeHcCard(s)));
    return;
  }

  HEALTH.categories.forEach(cat => {
    const inCat = filtered.filter(s => s.cat === cat.id);
    if (inCat.length > 0) container.appendChild(makeHcCatGroup(cat, inCat));
  });
}

function renderHcLegend() {
  const el = document.getElementById("hc-legend");
  const items = [
    { color: "#22c55e", label: "score 80+", sub: "優良" },
    { color: "#eab308", label: "score 40-79", sub: "普通" },
    { color: "#ef4444", label: "score 0-39",  sub: "低品質" },
    { color: "#444",    label: "CF / 未測定", sub: "" },
  ];
  items.forEach(i => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML =
      `<div class="legend-dot" style="background:${i.color}"></div>` +
      `<span>${i.label}</span>` +
      (i.sub ? `<span class="legend-sub">${i.sub}</span>` : "");
    el.appendChild(item);
  });
}

document.getElementById("hc-search").addEventListener("input", renderHcList);
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    hcCurrentCat = btn.dataset.cat;
    renderHcList();
  });
});

renderHcLegend();
renderHcList();
</script>
